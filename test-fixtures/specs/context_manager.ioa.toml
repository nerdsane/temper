# Context Manager — assembles context for inference.
# Integration (assemble_context) does the actual I/O work.

[automaton]
name = "ContextManager"
states = ["Idle", "Assembling", "Failed"]
initial = "Idle"

[[state]]
name = "preparations_done"
type = "counter"
initial = "0"

[[action]]
name = "PrepareContext"
kind = "input"
from = ["Idle"]
to = "Assembling"

[[action.triggers]]
name = "context_assemble_trigger"
kind = "entity"
target_entity = "ContextAssemblerIntegration"
target_action = "assemble_context"
resolve_target = { type = "same_id" }

[[action]]
name = "ContextReady"
kind = "input"
from = ["Assembling"]
to = "Idle"
effect = ["preparations_done += 1"]

[[action.triggers]]
name = "context_ready_to_agent"
kind = "entity"
target_entity = "Process"
target_action = "ContextReady"
resolve_target = { type = "same_id" }

[[action]]
name = "ContextOverflow"
kind = "input"
from = ["Assembling"]
to = "Idle"

[[action.triggers]]
name = "context_overflow_to_agent"
kind = "entity"
target_entity = "Process"
target_action = "ContextOverflow"
resolve_target = { type = "same_id" }

[[action]]
name = "AssemblyFailed"
kind = "input"
from = ["Assembling"]
to = "Failed"
