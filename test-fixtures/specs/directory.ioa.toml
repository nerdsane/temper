# Directory Entity — I/O Automaton Specification
#
# Hierarchical container within a workspace. Tracks child items and supports
# rename, move, and archival operations.

[automaton]
name = "Directory"
states = ["Active", "Archived"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active"]

# --- Declared keys (ADR-0153) ---
# (Name, WorkspaceId, ParentId) uniquely identifies a non-root directory; the
# kernel indexes it for O(log n) present/absent reads (subdirectory lookups, ARN-68).
# The root dir (ParentId null) has no key row — a null component is unindexable —
# and the root lookup uses the lossless caller path. REQUIRES the kernel with
# [[key]] support deployed first.

[[key]]
name = "name_parent"
properties = ["Name", "WorkspaceId", "ParentId"]

# --- State Variables ---

[[state]]
name = "item_count"
type = "counter"
initial = "0"

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Active"]
to = "Active"
params = [
  "name",
  "path",
  { name = "parent_id", type = "Edm.Guid", nullable = true },
  "workspace_id",
]
hint = "Create a new directory at the given path within a workspace."

[[action]]
name = "AddChild"
kind = "input"
from = ["Active"]
to = "Active"
effect = "increment item_count"
hint = "Register a child item (file or subdirectory) in this directory."

[[action]]
name = "RemoveChild"
kind = "input"
from = ["Active"]
to = "Active"
guard = "min item_count 1"
effect = "decrement item_count"
hint = "Remove a child item from this directory. Requires at least one child."

[[action]]
name = "Rename"
kind = "input"
from = ["Active"]
to = "Active"
params = ["name", "path"]
hint = "Rename the directory and update its path."

[[action]]
name = "Archive"
kind = "internal"
from = ["Active"]
to = "Archived"
guard = "max item_count 1"
hint = "Archive an empty directory. Must contain no children. Terminal state."

# --- Output Actions ---

[[action]]
name = "DirectoryArchivedEvent"
kind = "output"
hint = "Emitted when directory transitions to Archived."

# --- Safety Invariants ---

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

[[invariant]]
name = "ItemCountNonNegative"
when = ["Active", "Archived"]
assert = "item_count >= 0"
