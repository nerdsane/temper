# Compactor — compresses context when the window is too large.
# Integration (run_compaction) calls the LLM to summarize.

[automaton]
name = "Compactor"
states = ["Idle", "Compacting", "Failed"]
initial = "Idle"

[[state]]
name = "compactions_done"
type = "counter"
initial = "0"

[[action]]
name = "CompactionNeeded"
kind = "input"
from = ["Idle"]
to = "Compacting"

[[action.triggers]]
name = "compaction_run_trigger"
kind = "entity"
target_entity = "CompactionIntegration"
target_action = "run_compaction"
resolve_target = { type = "same_id" }

[[action]]
name = "CompactionComplete"
kind = "input"
from = ["Compacting"]
to = "Idle"
effect = ["compactions_done += 1"]

[[action.triggers]]
name = "compaction_complete_to_agent"
kind = "entity"
target_entity = "Process"
target_action = "CompactionComplete"
resolve_target = { type = "same_id" }

[[action]]
name = "CompactionFailed"
kind = "input"
from = ["Compacting"]
to = "Failed"

[[action.triggers]]
name = "compaction_failed_to_agent"
kind = "entity"
target_entity = "Process"
target_action = "CompactionFailed"
resolve_target = { type = "same_id" }
