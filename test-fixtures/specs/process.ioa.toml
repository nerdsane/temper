# Agent (Process) — the orchestrator state machine.
# Pure state machine: receives messages, transitions states, emits coordination events.
# Cross-actor routing is declared as [[action.triggers]] on the source actions.

[automaton]
name = "Process"
states = [
    "Created", "Ready", "PreparingContext", "BlockedInference",
    "BlockedToolCall", "BlockedApproval", "BlockedCompaction",
    "BlockedChild", "Suspended", "Terminated", "Failed",
]
initial = "Created"

[automaton.timeouts]
BlockedInference = "120s"
BlockedToolCall = "60s"
BlockedCompaction = "30s"
BlockedApproval = "3600s"

[[state]]
name = "turns"
type = "counter"
initial = "0"

[[state]]
name = "tool_call_rounds"
type = "counter"
initial = "0"

[[state]]
name = "child_count"
type = "counter"
initial = "0"

# ─── Lifecycle ────────────────────────────────────────────────────────────────

[[action]]
name = "Initialize"
kind = "input"
from = ["Created"]
to = "Ready"

# ─── Start / User Input ──────────────────────────────────────────────────────

[[action]]
name = "StartProcess"
kind = "input"
from = ["Ready"]
to = "PreparingContext"
params = [{ name = "user_prompt", type = "string" }]

[[action.triggers]]
name = "process_start_requests_context"
kind = "entity"
target_entity = "ContextManager"
target_action = "PrepareContext"
resolve_target = { type = "same_id" }

[[action]]
name = "SendInput"
kind = "input"
from = ["Ready", "Failed"]
to = "PreparingContext"
params = [{ name = "user_prompt", type = "string" }]

[[action.triggers]]
name = "process_start_requests_context"
kind = "entity"
target_entity = "ContextManager"
target_action = "PrepareContext"
resolve_target = { type = "same_id" }

# ─── Context Preparation Results ─────────────────────────────────────────────

[[action]]
name = "ContextReady"
kind = "input"
from = ["PreparingContext"]
to = "BlockedInference"

[[action.triggers]]
name = "llm_invoke_trigger"
kind = "entity"
target_entity = "LlmIntegration"
target_action = "invoke_llm"
resolve_target = { type = "same_id" }

[[action]]
name = "ContextOverflow"
kind = "input"
from = ["PreparingContext"]
to = "BlockedCompaction"

[[action.triggers]]
name = "process_compaction_needed"
kind = "entity"
target_entity = "Compactor"
target_action = "CompactionNeeded"
resolve_target = { type = "same_id" }

# ─── Inference Results ────────────────────────────────────────────────────────

[[action]]
name = "InferenceCompleteEndTurn"
kind = "input"
from = ["BlockedInference"]
to = "Ready"
effect = ["turns += 1"]

[[action.triggers]]
name = "process_notify_parent"
kind = "entity"
target_entity = "ChildCompletionIntegration"
target_action = "notify_parent_completion"
resolve_target = { type = "same_id" }

[[action]]
name = "InferenceCompleteToolCalls"
kind = "input"
from = ["BlockedInference"]
to = "BlockedToolCall"
effect = ["turns += 1"]

[[action.triggers]]
name = "process_tool_calls_to_router"
kind = "entity"
target_entity = "ToolRouter"
target_action = "ToolCallBatchRequested"
resolve_target = { type = "same_id" }

[[action]]
name = "InferenceContextOverflow"
kind = "input"
from = ["BlockedInference"]
to = "BlockedCompaction"

[[action.triggers]]
name = "process_compaction_needed"
kind = "entity"
target_entity = "Compactor"
target_action = "CompactionNeeded"
resolve_target = { type = "same_id" }

[[action]]
name = "InferenceFailed"
kind = "input"
from = ["BlockedInference"]
to = "Failed"

# ─── Tool Call Results ────────────────────────────────────────────────────────

[[action]]
name = "ToolCallBatchComplete"
kind = "input"
from = ["BlockedToolCall"]
to = "BlockedInference"
effect = ["tool_call_rounds += 1"]

[[action.triggers]]
name = "llm_invoke_trigger"
kind = "entity"
target_entity = "LlmIntegration"
target_action = "invoke_llm"
resolve_target = { type = "same_id" }

[[action]]
name = "ToolCallBatchFailed"
kind = "input"
from = ["BlockedToolCall"]
to = "Failed"

[[action.triggers]]
name = "process_notify_parent"
kind = "entity"
target_entity = "ChildCompletionIntegration"
target_action = "notify_parent_completion"
resolve_target = { type = "same_id" }

[[action]]
name = "ApprovalRequired"
kind = "input"
from = ["BlockedToolCall"]
to = "BlockedApproval"

[[action]]
name = "ApproveToolCall"
kind = "input"
from = ["BlockedApproval"]
to = "BlockedToolCall"

[[action.triggers]]
name = "process_tool_calls_to_router"
kind = "entity"
target_entity = "ToolRouter"
target_action = "ToolCallBatchRequested"
resolve_target = { type = "same_id" }

[[action]]
name = "DenyToolCall"
kind = "input"
from = ["BlockedApproval"]
to = "BlockedInference"

[[action.triggers]]
name = "llm_invoke_trigger"
kind = "entity"
target_entity = "LlmIntegration"
target_action = "invoke_llm"
resolve_target = { type = "same_id" }

# ─── Compaction Results ───────────────────────────────────────────────────────

[[action]]
name = "CompactionComplete"
kind = "input"
from = ["BlockedCompaction"]
to = "PreparingContext"

[[action.triggers]]
name = "process_start_requests_context"
kind = "entity"
target_entity = "ContextManager"
target_action = "PrepareContext"
resolve_target = { type = "same_id" }

[[action]]
name = "CompactionFailed"
kind = "input"
from = ["BlockedCompaction"]
to = "Failed"

[[action.triggers]]
name = "process_notify_parent"
kind = "entity"
target_entity = "ChildCompletionIntegration"
target_action = "notify_parent_completion"
resolve_target = { type = "same_id" }

# ─── Control ──────────────────────────────────────────────────────────────────

[[action]]
name = "SuspendProcess"
kind = "input"
from = ["Ready", "PreparingContext", "BlockedInference", "BlockedToolCall", "BlockedApproval", "BlockedCompaction"]
to = "Suspended"

[[action]]
name = "ResumeProcess"
kind = "input"
from = ["Suspended"]
to = "Ready"

[[action]]
name = "TerminateProcess"
kind = "input"
from = ["Created", "Ready", "PreparingContext", "BlockedInference", "BlockedToolCall", "BlockedApproval", "BlockedCompaction", "Suspended", "Failed"]
to = "Terminated"
params = [{ name = "reason", type = "string" }]

[[action]]
name = "TimeoutExpired"
kind = "input"
from = ["BlockedInference", "BlockedToolCall", "BlockedApproval", "BlockedCompaction"]
to = "Failed"

[[action.triggers]]
name = "process_notify_parent"
kind = "entity"
target_entity = "ChildCompletionIntegration"
target_action = "notify_parent_completion"
resolve_target = { type = "same_id" }

# ─── Integrations ─────────────────────────────────────────────────────────────

[[action]]
name = "SpawnChild"
kind = "input"
from = ["Ready", "BlockedInference", "BlockedToolCall"]
params = [
    { name = "child_definition_id", type = "string" },
    { name = "child_user_prompt",   type = "string" },
]
effect = ["child_count += 1"]
hint = "Spawn a child Process. The child runs independently; parent can wait via BlockOnChild."

[[action.triggers]]
name = "process_spawn_child"
kind = "entity"
target_entity = "ChildSpawnerIntegration"
target_action = "spawn_child"
resolve_target = { type = "same_id" }

[[action]]
name = "BlockOnChild"
kind = "input"
from = ["Ready"]
to = "BlockedChild"
hint = "Block until a child Process completes."

[[action]]
name = "UnblockFromChild"
kind = "input"
from = ["BlockedChild"]
to = "BlockedInference"
params = [{ name = "child_result", type = "string" }]
hint = "Unblock parent when a child Process completes and resume inference with the child result."

[[action.triggers]]
name = "llm_invoke_trigger"
kind = "entity"
target_entity = "LlmIntegration"
target_action = "invoke_llm"
resolve_target = { type = "same_id" }

# ─── Sleep primitive ──────────────────────────────────────────────────────────

[[action]]
name = "SleepProcess"
kind = "input"
from = ["Ready"]
to = "Ready"
params = [{ name = "sleep_seconds", type = "uint64" }]
hint = "Suspend execution for N seconds, then resume."

[[action.triggers]]
name = "process_schedule_wakeup"
kind = "entity"
target_entity = "WakeupSchedulerIntegration"
target_action = "schedule_wakeup"
resolve_target = { type = "same_id" }

# ─── Completion with parent notification ─────────────────────────────────────

[[action]]
name = "CompleteProcess"
kind = "input"
from = ["Ready"]
to = "Terminated"
params = [{ name = "final_answer", type = "string" }]

[[action.triggers]]
name = "process_notify_parent"
kind = "entity"
target_entity = "ChildCompletionIntegration"
target_action = "notify_parent_completion"
resolve_target = { type = "same_id" }

# ─── Integrations for new primitives ─────────────────────────────────────────
