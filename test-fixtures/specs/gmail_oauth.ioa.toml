[automaton]
name = "GmailAuth"
states = ["Disconnected", "AwaitingAuth", "Exchanging", "Authenticated", "Refreshing", "Expired"]
initial = "Disconnected"

[[action]]
name = "StartOAuth"
kind = "input"
from = ["Disconnected", "Expired"]
to = "AwaitingAuth"

[[action]]
name = "OAuthCallback"
kind = "input"
from = ["AwaitingAuth"]
to = "Exchanging"
params = ["code"]

[[action.triggers]]
name = "exchange_code"
kind = "wasm"
module = "http_fetch"
on_success = "ExchangeSucceeded"
on_failure = "ExchangeFailed"
config = { headers = '{"Content-Type": "application/x-www-form-urlencoded"}', method = "POST", url = "https://oauth2.googleapis.com/token" }

[[action]]
name = "ExchangeSucceeded"
kind = "input"
from = ["Exchanging"]
to = "Authenticated"
params = ["access_token", "refresh_token"]
effect = ["schedule('RefreshToken', 2700)"]

[[action]]
name = "ExchangeFailed"
kind = "input"
from = ["Exchanging"]
to = "Disconnected"

[[action]]
name = "RefreshToken"
kind = "input"
from = ["Authenticated"]
to = "Refreshing"

[[action.triggers]]
name = "refresh_token"
kind = "wasm"
module = "http_fetch"
on_success = "RefreshSucceeded"
on_failure = "RefreshFailed"
config = { headers = '{"Authorization": "Bearer {secret:gmail_refresh_token}"}', method = "POST", url = "https://oauth2.googleapis.com/token" }

[[action]]
name = "RefreshSucceeded"
kind = "input"
from = ["Refreshing"]
to = "Authenticated"
effect = ["schedule('RefreshToken', 2700)"]

[[action]]
name = "RefreshFailed"
kind = "input"
from = ["Refreshing"]
to = "Expired"

[[webhook]]
name = "oauth_callback"
path = "oauth/callback"
method = "GET"
action = "OAuthCallback"
entity_lookup = "query_param"
entity_param = "state"

[webhook.extract]
code = "query.code"
