[package]
name = "temper-store-turso"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Turso storage backend for Temper entity services"

[dependencies]
temper-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
turso = { version = "=0.7.2", default-features = false, features = ["sync"] }
turso_serverless = "=0.1.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
thiserror = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
opentelemetry = { workspace = true }

[features]
default = []
cloud = []
# `SyncCopy::execute_local`, for this crate's own tests.
test-support = []

[dev-dependencies]
temper-store-turso = { path = ".", features = ["test-support"] }
temper-test-resource = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
chrono = { workspace = true }
tempfile = "3"
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
