[package]
name = "temper-actor-runtime"
version.workspace = true
edition.workspace = true
description = "PG-backed mailbox actor runtime for Temper"

[features]
test-utils = ["dep:testcontainers", "dep:testcontainers-modules"]
# The workspace integration harness registers these unchanged PG proofs instead
# of running them in separate unit- and integration-test executables. Standalone
# defaults retain the original registrations.
test-shared-pg-proofs = ["test-utils"]

[dependencies]
tokio = { workspace = true }
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
temper-runtime = { workspace = true }
temper-spec = { workspace = true }
temper-jit = { workspace = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-postgres = { workspace = true }
serde_json = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
