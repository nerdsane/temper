[package]
name = "temper-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM sandboxed integration runtime for Temper"

[dependencies]
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tokio-stream = { workspace = true }
native-tls = { version = "0.2", optional = true }
futures-util = "0.3"
bytes = "1"
async-stream = "0.3"
sha2 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
temper-observe = { workspace = true }
uuid = { workspace = true }

[features]
test-helpers = []
# Test-only compiled-code reuse. Registrations and per-invocation Stores remain
# isolated. Keep this on dev-dependencies, never production dependencies.
test-shared-compilation = []
# Test-only immutable TLS preparation; HTTP clients and pools remain per engine.
test-prepared-default-tls = ["dep:native-tls", "reqwest/native-tls"]

[dev-dependencies]
base64 = "0.22"
native-tls = "0.2"
reqwest = { workspace = true, features = ["native-tls"] }
tokio-native-tls = "0.3"
tokio-test = { workspace = true }
# `testing` gives the in-memory span exporter used by the ARN-243 behavioral
# redaction test. Dev-only: not built into any production artifact.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
axum = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The native TLS backend already uses OpenSSL on Linux; generate ephemeral
# loopback certificates without adding an OpenSSL requirement on other hosts.
openssl = "0.10"
