[package]
name = "temper-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM sandboxed integration runtime for Temper"

[dependencies]
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tokio-stream = { workspace = true }
futures-util = "0.3"
bytes = "1"
async-stream = "0.3"
sha2 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
temper-observe = { workspace = true }
temper-wasm-sdk = { workspace = true }
uuid = { workspace = true }

[features]
test-helpers = []

[dev-dependencies]
base64 = "0.22"
tokio-test = { workspace = true }
# `testing` gives the in-memory span exporter used by the ARN-243 behavioral
# redaction test. Dev-only: not built into any production artifact.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
