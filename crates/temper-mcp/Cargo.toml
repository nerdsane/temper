[package]
name = "temper-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP stdio server for Temper Code Mode tools"

[dependencies]
temper-sandbox = { workspace = true }
# Code Mode tools: server-independent spec verification and transition simulation.
# temper-verify brings stateright + proptest. This is intentional: temper-mcp is a
# developer tool (not a production entity-actor binary), so the L1 model-checker
# must be available in-process. See ADR-0032.
temper-spec = { workspace = true }
temper-jit = { workspace = true }
temper-verify = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "macros"] }
reqwest = { workspace = true }
sha2 = { workspace = true }
hostname = { workspace = true }

# pydantic/monty Rust sandbox crate
monty = { git = "https://github.com/pydantic/monty.git", package = "monty", rev = "bf7c7ef" }

[dev-dependencies]
axum = { workspace = true }
temper-server = { workspace = true, features = ["observe"] }
temper-runtime = { workspace = true }
temper-store-turso = { workspace = true }
