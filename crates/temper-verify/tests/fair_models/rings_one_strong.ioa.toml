[automaton]
name = "Rings"
states = ["Idle", "A", "B", "C", "Out"]
initial = "Idle"

[[action]]
name = "Begin"
kind = "input"
from = ["Idle"]
to = "A"

[[action]]
name = "AB"
kind = "input"
from = ["A"]
to = "B"

[[action]]
name = "BC"
kind = "input"
from = ["B"]
to = "C"

[[action]]
name = "CB"
kind = "input"
from = ["C"]
to = "B"

[[action]]
name = "CA"
kind = "input"
from = ["C"]
to = "A"

[[action]]
name = "X"
kind = "input"
from = ["A"]
to = "Out"

[[liveness]]
name = "GetsOut"
eventually = "status == 'Idle' || status == 'Out'"
relies_on = ["AB", "BC", "CB", "CA", "X"]
fairness = { weak = ["AB", "BC", "CB", "CA"], strong = ["X"] }
