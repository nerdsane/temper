[automaton]
name = "Loop"
states = ["Idle", "A", "B", "Out", "Away"]
initial = "Idle"

[[action]]
name = "Begin"
kind = "input"
from = ["Idle"]
to = "A"

[[action]]
name = "Go"
kind = "internal"
from = ["A"]
to = "B"

[[action]]
name = "Back"
kind = "internal"
from = ["B"]
to = "A"

[[action]]
name = "Exit"
kind = "input"
from = ["A"]
to = "Away"

[[state_timeout]]
state = "A"
after_seconds = 60
on_timeout = "Go"

[[state_timeout]]
state = "B"
after_seconds = 60
on_timeout = "Back"

[[action]]
name = "Return"
kind = "internal"
from = ["Away"]
to = "A"

[[state_timeout]]
state = "Away"
after_seconds = 60
on_timeout = "Return"

[[liveness]]
name = "GetsOut"
eventually = "status == 'Idle' || status == 'Out'"
relies_on = ["Exit"]
fairness = { strong = ["Exit"] }
