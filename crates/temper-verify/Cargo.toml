[package]
name = "temper-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model checking and property-based testing for Temper specifications"

[dependencies]
temper-runtime = { workspace = true }
temper-spec = { workspace = true }
stateright = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
z3 = { version = "0.19" }

# Distribution-supported GNU/Linux targets use the same prebuilt solver rather
# than whichever (often much older) library the host package manager supplies.
# Other targets retain their existing system-library integration.
[target.'cfg(all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
z3 = { version = "0.19", features = ["gh-release"] }
