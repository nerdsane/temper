[package]
name = "temper-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model checking and property-based testing for Temper specifications"

[features]
# Check every step a walk remembers against the move made afresh.
check-every-remembered-step = []

[dependencies]
temper-runtime = { workspace = true }
temper-spec = { workspace = true }
temper-authz = { workspace = true }
stateright = { workspace = true }
dashmap = "6.1"
thread_local = "1.1"
rustc-hash = "2.1"
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
z3 = { version = "0.19" }

[dev-dependencies]
temper-jit = { workspace = true }
