[automaton]
name = "Project"
initial = "Created"
states = ["Created", "Building", "Verified", "Archived"]

[[state]]
name = "spec_count"
type = "counter"
initial = "0"

[[state]]
name = "verified"
type = "bool"
initial = "false"

[[action]]
name = "CreateProject"
from = []
to = "Created"
kind = "input"

[[action]]
name = "UpdateSpecs"
from = ["Created", "Building", "Verified"]
to = "Building"
kind = "input"
effect = ["spec_count += 1"]

[[action]]
name = "Verify"
from = ["Building"]
to = "Verified"
kind = "internal"
guard = "spec_count >= 1"
effect = ["verified = true"]

[[action]]
name = "Archive"
from = ["Created", "Building", "Verified"]
to = "Archived"
kind = "input"

[[invariant]]
name = "VerifiedRequiresSpecs"
assert = "status in ['Verified'] => spec_count > 0"
