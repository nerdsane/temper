[automaton]
name = "Problem"
initial = "Open"
states = ["Open", "Reviewed", "Resolved", "Superseded"]

[[action]]
name = "CreateProblem"
from = []
to = "Open"
kind = "input"
params = ["observation_id", "problem_statement", "severity", "invariants"]
guard = "empty(observation_id) || Observation[observation_id].status in ['Open', 'UnderReview']"

[[action]]
name = "MarkReviewed"
from = ["Open"]
to = "Reviewed"
kind = "input"

[[action]]
name = "Resolve"
from = ["Open", "Reviewed"]
to = "Resolved"
kind = "input"

[[action]]
name = "Supersede"
from = ["Open", "Reviewed"]
to = "Superseded"
kind = "input"
