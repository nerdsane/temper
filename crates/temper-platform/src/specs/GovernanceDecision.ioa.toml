[automaton]
name = "GovernanceDecision"
initial = "Pending"
states = ["Pending", "Approved", "Denied", "Expired"]

# --- State Variables ---

[[state]]
name = "tenant"
type = "string"
initial = ""

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "action_name"
type = "string"
initial = ""

[[state]]
name = "resource_type"
type = "string"
initial = ""

[[state]]
name = "resource_id"
type = "string"
initial = ""

[[state]]
name = "denial_reason"
type = "string"
initial = ""

[[state]]
name = "scope"
type = "string"
initial = ""

[[state]]
name = "pending_decision_id"
type = "string"
initial = ""

[[state]]
name = "decided_by"
type = "string"
initial = ""

[[state]]
name = "generated_policy"
type = "string"
initial = ""

# --- Callback Fields ---

[[state]]
name = "callback_tenant"
type = "string"
initial = ""

[[state]]
name = "callback_entity_set"
type = "string"
initial = ""

[[state]]
name = "callback_entity_id"
type = "string"
initial = ""

[[state]]
name = "callback_on_approve"
type = "string"
initial = ""

[[state]]
name = "callback_on_deny"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "CreateGovernanceDecision"
from = []
to = "Pending"
kind = "input"
params = ["tenant", "agent_id", "action_name", "resource_type", "resource_id", "denial_reason", "scope", "pending_decision_id"]

[[action]]
name = "RegisterCallback"
from = ["Pending", "Approved", "Denied"]
kind = "input"
params = ["callback_tenant", "callback_entity_set", "callback_entity_id", "callback_on_approve", "callback_on_deny"]
hint = "Register entity callback for decision resolution. Self-loop — does not change state. Late registration after approval/denial immediately replays DispatchCallback."
effect = "trigger DispatchCallback"

[[action]]
name = "Approve"
from = ["Pending"]
to = "Approved"
kind = "input"
params = ["decided_by", "scope", "generated_policy"]
effect = '[{ type = "trigger", name = "GenerateCedarPolicy" }, { type = "trigger", name = "DispatchCallback" }]'

[[action]]
name = "Deny"
from = ["Pending"]
to = "Denied"
kind = "input"
params = ["decided_by", "denial_reason"]
effect = "trigger DispatchCallback"

[[action]]
name = "Expire"
from = ["Pending"]
to = "Expired"
kind = "internal"

# --- Invariants ---

[[invariant]]
name = "ApprovedFollowsPending"
when = ["Approved"]
assert = "ordering(Pending, Approved)"

[[invariant]]
name = "DeniedFollowsPending"
when = ["Denied"]
assert = "ordering(Pending, Denied)"

[[invariant]]
name = "ExpiredFollowsPending"
when = ["Expired"]
assert = "ordering(Pending, Expired)"
