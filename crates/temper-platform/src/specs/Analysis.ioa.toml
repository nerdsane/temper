[automaton]
name = "Analysis"
initial = "Open"
states = ["Open", "Reviewed", "Accepted", "Rejected"]

[[action]]
name = "CreateAnalysis"
from = []
to = "Open"
kind = "input"
params = ["problem_id", "root_cause", "options", "recommendation"]
guard = "empty(problem_id) || Problem[problem_id].status in ['Reviewed']"

[[action]]
name = "MarkReviewed"
from = ["Open"]
to = "Reviewed"
kind = "input"

[[action]]
name = "Accept"
from = ["Reviewed"]
to = "Accepted"
kind = "input"

[[action]]
name = "Reject"
from = ["Reviewed"]
to = "Rejected"
kind = "input"
