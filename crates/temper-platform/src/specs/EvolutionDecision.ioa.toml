[automaton]
name = "EvolutionDecision"
initial = "Open"
states = ["Open", "Approved", "Rejected", "Deferred"]

[[action]]
name = "CreateDecision"
from = []
to = "Open"
kind = "input"
params = ["analysis_id", "decided_by", "rationale", "verification_summary"]
guard = "empty(analysis_id) || Analysis[analysis_id].status in ['Reviewed']"

[[action]]
name = "Approve"
from = ["Open"]
to = "Approved"
kind = "input"

[[action]]
name = "Reject"
from = ["Open"]
to = "Rejected"
kind = "input"

[[action]]
name = "Defer"
from = ["Open"]
to = "Deferred"
kind = "input"

[[invariant]]
name = "ApprovedIsTerminal"
assert = "status in ['Approved'] => true"

[[invariant]]
name = "RejectedIsTerminal"
assert = "status in ['Rejected'] => true"
