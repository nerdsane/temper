[package]
name = "temper-agents"
version.workspace = true
edition.workspace = true
description = "Agent system actors built on temper-actor-runtime"

[features]
# Register unchanged PG chain proofs in the workspace integration harness only.
# Standalone defaults retain the original agent_chain test registrations.
test-shared-pg-proofs = ["dep:deadpool-postgres", "temper-actor-runtime/test-utils"]

[dependencies]
temper-actor-runtime = { workspace = true }
deadpool-postgres = { workspace = true, optional = true }
temper-runtime = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
deadpool-postgres = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
temper-actor-runtime = { workspace = true, features = ["test-utils"] }
uuid = { workspace = true }
