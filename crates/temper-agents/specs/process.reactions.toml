# Agent system reaction rules.
# Wires the Actor state machines together via addressed messages.
#
# Specs emit events; reaction rules route them to the right actor.
# Convention: action name = message_type string.

# ─── Agent → ContextManager ───────────────────────────────────────────────────

[[reaction]]
name = "process_start_requests_context"
[reaction.when]
entity_type = "Process"
action = "PrepareContext"
[reaction.then]
entity_type = "ContextManager"
action = "PrepareContext"
[reaction.resolve_target]
type = "SameId"

# ─── ContextManager → Agent ───────────────────────────────────────────────────

[[reaction]]
name = "context_ready_to_agent"
[reaction.when]
entity_type = "ContextManager"
action = "ContextReady"
[reaction.then]
entity_type = "Process"
action = "ContextReady"
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "context_overflow_to_agent"
[reaction.when]
entity_type = "ContextManager"
action = "ContextOverflow"
[reaction.then]
entity_type = "Process"
action = "ContextOverflow"
[reaction.resolve_target]
type = "SameId"

