# Agent system reaction rules.
# Wires the Actor state machines together via addressed messages.
#
# Specs emit events; reaction rules route them to the right actor.
# Convention: action name = message_type string.

# ─── Agent → ContextManager ───────────────────────────────────────────────────

[[reaction]]
name = "process_start_requests_context"
[reaction.when]
entity_type = "Process"
action = "PrepareContext"
[reaction.then]
entity_type = "ContextManager"
action = "PrepareContext"
[reaction.resolve_target]
type = "SameId"

# ─── ContextManager → Agent ───────────────────────────────────────────────────

[[reaction]]
name = "context_ready_to_agent"
[reaction.when]
entity_type = "ContextManager"
action = "ContextReady"
[reaction.then]
entity_type = "Process"
action = "ContextReady"
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "context_overflow_to_agent"
[reaction.when]
entity_type = "ContextManager"
action = "ContextOverflow"
[reaction.then]
entity_type = "Process"
action = "ContextOverflow"
[reaction.resolve_target]
type = "SameId"

# ─── Agent → ToolRouter ───────────────────────────────────────────────────────

[[reaction]]
name = "process_tool_calls_to_router"
[reaction.when]
entity_type = "Process"
action = "ToolCallBatchRequested"
[reaction.then]
entity_type = "ToolRouter"
action = "ToolCallBatchRequested"
params_from = { tool_calls = "tool_calls" }
[reaction.resolve_target]
type = "SameId"

# ─── ToolRouter → Agent ───────────────────────────────────────────────────────

[[reaction]]
name = "tools_complete_to_agent"
[reaction.when]
entity_type = "ToolRouter"
action = "ToolCallBatchComplete"
[reaction.then]
entity_type = "Process"
action = "ToolCallBatchComplete"
params_from = { tool_results = "tool_results" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "tools_failed_to_agent"
[reaction.when]
entity_type = "ToolRouter"
action = "ToolCallBatchFailed"
[reaction.then]
entity_type = "Process"
action = "ToolCallBatchFailed"
params_from = { error = "error" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "approval_required_to_agent"
[reaction.when]
entity_type = "ToolRouter"
action = "ApprovalRequired"
[reaction.then]
entity_type = "Process"
action = "ApprovalRequired"
[reaction.resolve_target]
type = "SameId"

# ─── Agent → Compactor ────────────────────────────────────────────────────────

[[reaction]]
name = "process_compaction_needed"
[reaction.when]
entity_type = "Process"
action = "CompactionNeeded"
[reaction.then]
entity_type = "Compactor"
action = "CompactionNeeded"
[reaction.resolve_target]
type = "SameId"

# ─── Compactor → Agent ────────────────────────────────────────────────────────

[[reaction]]
name = "compaction_complete_to_agent"
[reaction.when]
entity_type = "Compactor"
action = "CompactionComplete"
[reaction.then]
entity_type = "Process"
action = "CompactionComplete"
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "compaction_failed_to_agent"
[reaction.when]
entity_type = "Compactor"
action = "CompactionFailed"
[reaction.then]
entity_type = "Process"
action = "CompactionFailed"
[reaction.resolve_target]
type = "SameId"

# ─── Integration routing (triggers → integration actors) ─────────────────────
# These wire spec trigger effects to the integration actor implementations.
# The integration actors handle the actual I/O and reply back.

[[reaction]]
name = "llm_invoke_trigger"
[reaction.when]
entity_type = "Process"
action = "invoke_llm"
[reaction.then]
entity_type = "LlmIntegration"
action = "invoke_llm"
params_from = { user_prompt = "user_prompt", tool_results = "tool_results", child_result = "child_result" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "context_assemble_trigger"
[reaction.when]
entity_type = "ContextManager"
action = "assemble_context"
[reaction.then]
entity_type = "ContextAssemblerIntegration"
action = "assemble_context"
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "tool_execute_trigger"
[reaction.when]
entity_type = "ToolRouter"
action = "execute_tool_batch"
[reaction.then]
entity_type = "ToolExecutorIntegration"
action = "execute_tool_batch"
params_from = { tool_calls = "tool_calls" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "compaction_run_trigger"
[reaction.when]
entity_type = "Compactor"
action = "run_compaction"
[reaction.then]
entity_type = "CompactionIntegration"
action = "run_compaction"
[reaction.resolve_target]
type = "SameId"

# ─── Child process primitives ─────────────────────────────────────────────────

[[reaction]]
name = "process_spawn_child"
[reaction.when]
entity_type = "Process"
action = "spawn_child"
[reaction.then]
entity_type = "ChildSpawnerIntegration"
action = "spawn_child"
params_from = { child_definition_id = "child_definition_id", child_user_prompt = "child_user_prompt", child_process_id = "child_process_id", tool_names = "tool_names" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "process_notify_parent_after_completion"
[reaction.when]
entity_type = "Process"
action = "notify_parent"
to_state = "Terminated"
[reaction.then]
entity_type = "ChildCompletionIntegration"
action = "notify_parent_completion"
params_from = { parent_pid = "parent_pid", child_result = "final_answer" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "process_notify_parent_after_inference"
[reaction.when]
entity_type = "Process"
action = "notify_parent"
to_state = "Ready"
[reaction.then]
entity_type = "ChildCompletionIntegration"
action = "notify_parent_completion"
params_from = { parent_pid = "parent_pid", child_result = "response" }
[reaction.resolve_target]
type = "SameId"

[[reaction]]
name = "process_notify_parent_after_failure"
[reaction.when]
entity_type = "Process"
action = "notify_parent"
to_state = "Failed"
[reaction.then]
entity_type = "ChildCompletionIntegration"
action = "notify_parent_completion"
params_from = { parent_pid = "parent_pid", child_result = "error" }
[reaction.resolve_target]
type = "SameId"

# ─── Sleep primitive ──────────────────────────────────────────────────────────

[[reaction]]
name = "process_schedule_wakeup"
[reaction.when]
entity_type = "Process"
action = "schedule_wakeup"
[reaction.then]
entity_type = "WakeupSchedulerIntegration"
action = "schedule_wakeup"
params_from = { sleep_seconds = "sleep_seconds" }
[reaction.resolve_target]
type = "SameId"
