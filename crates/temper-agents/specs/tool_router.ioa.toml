# Tool Router — dispatches and executes tool call batches.
# Integration (execute_tool_batch) handles fan-out and execution.

[automaton]
name = "ToolRouter"
states = ["Idle", "Executing", "WaitingApproval"]
initial = "Idle"

[[state]]
name = "batches_executed"
type = "counter"
initial = "0"

[[action]]
name = "ToolCallBatchRequested"
kind = "input"
from = ["Idle"]
to = "Executing"

[[action.triggers]]
name = "tool_execute_trigger"
kind = "entity"
target_entity = "ToolExecutorIntegration"
target_action = "execute_tool_batch"
resolve_target = { type = "same_id" }

[[action]]
name = "ToolCallBatchComplete"
kind = "input"
from = ["Executing"]
to = "Idle"
effect = ["batches_executed += 1"]

[[action.triggers]]
name = "tools_complete_to_agent"
kind = "entity"
target_entity = "Process"
target_action = "ToolCallBatchComplete"
resolve_target = { type = "same_id" }

[[action]]
name = "ToolCallBatchFailed"
kind = "input"
from = ["Executing"]
to = "Idle"

[[action.triggers]]
name = "tools_failed_to_agent"
kind = "entity"
target_entity = "Process"
target_action = "ToolCallBatchFailed"
resolve_target = { type = "same_id" }

[[action]]
name = "BatchNeedsApproval"
kind = "input"
from = ["Executing"]
to = "WaitingApproval"

[[action]]
name = "ApprovalGranted"
kind = "input"
from = ["WaitingApproval"]
to = "Executing"

[[action.triggers]]
name = "tool_execute_trigger"
kind = "entity"
target_entity = "ToolExecutorIntegration"
target_action = "execute_tool_batch"
resolve_target = { type = "same_id" }

[[action]]
name = "ApprovalDenied"
kind = "input"
from = ["WaitingApproval"]
to = "Idle"
