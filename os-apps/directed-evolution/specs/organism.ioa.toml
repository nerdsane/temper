[automaton]
name = "Organism"
states = ["Draft", "Active", "Archived"]
initial = "Draft"
allow_indefinite_states = ["Draft", "Active"]
terminal = ["Archived"]

[[state]]
name = "has_parent_version"
type = "bool"
initial = "false"

[[state]]
name = "version_count"
type = "counter"
initial = "0"

[[action]]
name = "ActivateOrganism"
kind = "input"
from = ["Draft"]
to = "Active"
effect = ["has_parent_version = true", "version_count += 1"]
params = ["Name", "AppRef", "ParentVersionId", "BaselineEvaluationJson"]
hint = "Register the organism with its first parent version and baseline evaluation ladder."

[[action]]
name = "RecordOrganismVersion"
kind = "input"
from = ["Active"]
effect = ["version_count += 1"]
params = ["OrganismVersionId", "PromotionId", "AppRef", "Summary"]
hint = "Record that a promoted organism version belongs to this organism."

[[action]]
name = "SyncOrganismParentRef"
kind = "input"
from = ["Active"]
params = ["OrganismVersionId", "PromotionId", "AppRef", "Summary"]
hint = "Synchronize current parent version fields without recording a new version."

[[action]]
name = "ArchiveOrganism"
kind = "input"
from = ["Active"]
to = "Archived"
params = ["Reason"]
hint = "Archive an organism."

[[invariant]]
name = "ActiveHasParentVersion"
assert = "status in ['Active'] => has_parent_version"
