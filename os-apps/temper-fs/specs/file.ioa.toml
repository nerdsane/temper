# File Entity — I/O Automaton Specification
#
# Represents a single file within TemperFS. Models the lifecycle from creation
# through content upload, locking, and archival. Content is stored externally;
# StreamUpdated is fired by the $value PUT handler after WASM upload succeeds.

[automaton]
name = "File"
states = ["Created", "Ready", "Locked", "Archived"]
initial = "Created"

# --- State Variables ---

[[state]]
name = "version_count"
type = "counter"
initial = "0"

[[state]]
name = "size_bytes"
type = "counter"
initial = "0"

[[state]]
name = "has_content"
type = "bool"
initial = "false"

[[state]]
name = "content_hash"
type = "string"
initial = ""

[[state]]
name = "mime_type"
type = "string"
initial = ""

[[state]]
name = "last_version_id"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Created"]
to = "Created"
params = ["name", "path", "directory_id", "workspace_id", "mime_type"]
hint = "Create a new file entry. Content is not yet uploaded."

[[action]]
name = "StreamUpdated"
kind = "input"
from = ["Created", "Ready"]
to = "Ready"
params = ["content_hash", "size_bytes", "mime_type", "version_number", "previous_version_id", "created_by"]
guard = [
  { type = "cross_entity_state", entity_type = "Workspace", entity_id_source = "workspace_id", required_status = ["Active"] },
]
effect = [
  { type = "increment", var = "version_count" },
  { type = "set_counter_from_param", var = "size_bytes", param = "size_bytes" },
  { type = "set_bool", var = "has_content", value = "true" },
]
hint = "Fired by $value PUT handler after WASM upload succeeds. Updates content metadata and advances to Ready. Not callable from Locked. Guarded: the owning Workspace must be Active — a Frozen/Archived workspace rejects new writes outright, so the usage-increment reaction never needs to fire on a non-Active workspace."

# ADR-0046: inline triggers are the single source of truth for the
# File -> FileVersion / Workspace cascade after StreamUpdated commits.

[[action.triggers]]
name = "file_stream_updated_creates_version"
kind = "entity"
principal = "file-service"
to_state = "Ready"
target_entity = "FileVersion"
target_action = "Create"

[action.triggers.params_from]
file_id = "Id"
version_number = "version_count"
content_hash = "content_hash"
size_bytes = "size_bytes"
mime_type = "mime_type"
previous_version_id = "previous_version_id"
created_by = "created_by"

[action.triggers.resolve_target]
type = "create"

[[action.triggers]]
name = "file_stream_updated_supersedes_old_version"
kind = "entity"
principal = "file-service"
target_entity = "FileVersion"
target_action = "Supersede"

[action.triggers.resolve_target]
type = "field"
field = "last_version_id"

[[action.triggers]]
name = "file_stream_updated_increments_workspace_usage"
kind = "entity"
principal = "file-service"
target_entity = "Workspace"
target_action = "IncrementUsage"

[action.triggers.params_from]
size_bytes = "size_bytes"

[action.triggers.resolve_target]
type = "field"
field = "workspace_id"

[[action]]
name = "RecordVersion"
kind = "internal"
from = ["Created", "Ready", "Locked"]
params = ["last_version_id"]
hint = "Record the newest FileVersion entity after a successful version create cascade. State-preserving self-loop (no `to`): recording the back-pointer must not advance the File's lifecycle state. Accepted from Created so the pointer lands even before the first StreamUpdated reaches Ready."

[[action]]
name = "Lock"
kind = "internal"
from = ["Ready"]
to = "Locked"
hint = "Lock the file to prevent content modifications."

[[action]]
name = "Unlock"
kind = "internal"
from = ["Locked"]
to = "Ready"
hint = "Unlock a locked file, re-enabling content modifications."

[[action]]
name = "Archive"
kind = "internal"
from = ["Ready", "Locked"]
to = "Archived"
hint = "Archive the file. Terminal state."

# --- Output Actions ---

[[action]]
name = "FileArchivedEvent"
kind = "output"
hint = "Emitted when file transitions to Archived."

[[action]]
name = "FileContentUpdatedEvent"
kind = "output"
hint = "Emitted when file content is updated via StreamUpdated."

# --- Safety Invariants ---

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

[[invariant]]
name = "ReadyFilesHaveContent"
when = ["Ready", "Locked"]
assert = "has_content"

[[invariant]]
name = "VersionCountNonNegative"
when = ["Created", "Ready", "Locked", "Archived"]
assert = "version_count >= 0"

[[invariant]]
name = "SizeBytesNonNegative"
when = ["Created", "Ready", "Locked", "Archived"]
assert = "size_bytes >= 0"
