# FileVersion Entity — I/O Automaton Specification
#
# Immutable record of a specific file version. Created when content is uploaded
# and superseded when a newer version replaces it.

[automaton]
name = "FileVersion"
states = ["Current", "Superseded"]
initial = "Current"

# --- State Variables ---

[[state]]
name = "file_id"
type = "string"
initial = ""

[[state]]
name = "version_number"
type = "counter"
initial = "0"

[[state]]
name = "content_hash"
type = "string"
initial = ""

[[state]]
name = "mime_type"
type = "string"
initial = ""

[[state]]
name = "size_bytes"
type = "counter"
initial = "0"

[[state]]
name = "previous_version_id"
type = "string"
initial = ""

[[state]]
name = "created_by"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Current"]
to = "Current"
params = ["file_id", "version_number", "content_hash", "mime_type", "size_bytes", "previous_version_id", "created_by"]
effect = [
  { type = "set_counter_from_param", var = "version_number", param = "version_number" },
  { type = "set_counter_from_param", var = "size_bytes", param = "size_bytes" },
]
hint = "Create a new file version record with content metadata."

[[action.triggers]]
name = "record_newest_version_on_file"
kind = "entity"
principal = "file-service"
target_entity = "File"
target_action = "RecordVersion"

[action.triggers.params_from]
last_version_id = "Id"

[action.triggers.resolve_target]
type = "field"
field = "file_id"

[[action]]
name = "Supersede"
kind = "internal"
from = ["Current", "Superseded"]
to = "Superseded"
hint = "Mark this version as superseded by a newer version. Idempotent: re-superseding an already-superseded version is a benign no-op."

# --- Output Actions ---

[[action]]
name = "FileVersionSupersededEvent"
kind = "output"
hint = "Emitted when a file version is superseded."

# --- Safety Invariants ---

# Superseded is a lifecycle dead-end: the ONLY action enabled from it is the
# idempotent `Supersede` self-loop (`to = "Superseded"`), which carries no
# effects and never targets `Current`. Finality-of-state is therefore
# structural — there is no transition out of `Superseded` to any other state.
# A literal `no_further_transitions` assertion is intentionally NOT used here:
# the owner's decision makes re-superseding a benign no-op, which requires the
# self-loop to stay enabled. The version's immutable content is covered by the
# non-negativity invariants below, which hold in `Superseded` as well.

[[invariant]]
name = "VersionNumberNonNegative"
when = ["Current", "Superseded"]
assert = "version_number >= 0"

[[invariant]]
name = "SizeBytesNonNegative"
when = ["Current", "Superseded"]
assert = "size_bytes >= 0"
