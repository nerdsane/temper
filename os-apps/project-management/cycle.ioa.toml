# Cycle Entity — I/O Automaton Specification
#
# Time-boxed sprint within a project.

[automaton]
name = "Cycle"
states = ["Planning", "Active", "Completed"]
initial = "Planning"
terminal = ["Completed"]

# --- State Variables ---

[[state]]
name = "issue_count"
type = "counter"
initial = "0"

[[state]]
name = "completed_count"
type = "counter"
initial = "0"

[[state]]
name = "project_id"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "SetProject"
kind = "input"
from = ["Planning"]
params = ["project_id"]
hint = "Associate this cycle with a project."

[[action]]
name = "AddIssueToCycle"
kind = "input"
from = ["Planning", "Active"]
effect = ["issue_count += 1"]
params = ["IssueId"]
hint = "Add an issue to this cycle."

[[action]]
name = "Start"
kind = "internal"
from = ["Planning"]
to = "Active"
guard = "issue_count > 0"
hint = "Start the cycle. Requires at least one issue."

[[action]]
name = "MarkIssueComplete"
kind = "input"
from = ["Active"]
effect = ["completed_count += 1"]
params = ["IssueId"]
hint = "Record that an issue within this cycle has been completed."

[[action]]
name = "Complete"
kind = "internal"
from = ["Active"]
to = "Completed"
hint = "Complete the cycle. Unfinished issues carry over."

[[action]]
name = "RemoveIssueFromCycle"
kind = "input"
from = ["Planning", "Active"]
guard = "issue_count > 0"
params = ["IssueId"]
hint = "Remove an issue from this cycle."

[[invariant]]
name = "ActiveRequiresIssues"
assert = "status in ['Active'] => issue_count > 0"

# --- Liveness ---

[[liveness]]
name = "CycleEventuallyCompletes"
from = ["Planning"]
reaches = ["Completed"]
