[workspace]
resolver = "2"
exclude = [
    "wasm-modules/http-fetch",
    "wasm-modules/gepa-replay",
    "wasm-modules/gepa-score",
    "wasm-modules/gepa-pareto",
    "wasm-modules/gepa-reflective",
    "wasm-modules/gepa-proposer-agent",
    "wasm-modules/gepa-verify",
    "crates/temper-wasm/tests/fixtures/echo-integration-src",
    "os-apps/temper-agent/wasm/llm_caller",
    "os-apps/temper-agent/wasm/tool_runner",
    "os-apps/temper-agent/wasm/sandbox_provisioner",
    "os-apps/temper-fs/wasm/blob_adapter",
    "vendor/turso-sdk-kit",
    "vendor/turso-sync-sdk-kit",
    "vendor/cc",
]
members = [
    "crates/temper-macros",
    "crates/temper-runtime",
    "crates/temper-spec",
    "crates/temper-codegen",
    "crates/temper-odata",
    "crates/temper-authz",
    "crates/temper-observe",
    "crates/temper-verify",
    "crates/temper-store-postgres",
    "crates/temper-store-turso",
    "crates/temper-store-redis",
    "crates/temper-store-sim",
    "crates/temper-server",
    "crates/temper-integration-tests",
    "crates/temper-cli",
    "crates/temper-mcp",
    "crates/temper-evolution",
    "crates/temper-jit",
    "crates/temper-optimize",
    "crates/temper-platform",
    "crates/temper-wasm",
    "crates/temper-wasm-sdk",
    "crates/temper-sdk",
    "crates/temper-sandbox",
    "crates/temper-ots",
    "crates/temper-transport",
    "crates/temper-actor-runtime",
    "crates/temper-agents",
    "reference-apps/crucible",
    "reference-apps/ecommerce",
    "reference-apps/oncall",
    "reference-apps/readers-writers",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP
axum = "0.8"
hyper = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "migrate"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14"
fred = { version = "10", features = ["subscriber-client", "i-scripts", "sha-1"] }

# Auth
cedar-policy = "4"

# Verification
stateright = "0.31"
proptest = "1"

# OpenTelemetry
opentelemetry = "0.28"
opentelemetry-otlp = { version = "0.28", features = ["logs", "metrics"] }
opentelemetry_sdk = { version = "0.28", features = ["logs", "metrics"] }
opentelemetry-appender-tracing = "0.28"
tracing-opentelemetry = "0.29"

# Environment
dotenvy = "0.15"

# XML (CSDL parsing)
quick-xml = { version = "0.41", features = ["serialize"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Proc macro support (for temper-codegen)
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# UUID
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for ClickHouse adapter + LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Testing
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
serial_test = "3"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"

# Internal crates
temper-macros = { path = "crates/temper-macros" }
temper-runtime = { path = "crates/temper-runtime" }
temper-spec = { path = "crates/temper-spec" }
temper-codegen = { path = "crates/temper-codegen" }
temper-odata = { path = "crates/temper-odata" }
temper-authz = { path = "crates/temper-authz" }
temper-observe = { path = "crates/temper-observe" }
temper-verify = { path = "crates/temper-verify" }
temper-store-postgres = { path = "crates/temper-store-postgres" }
temper-store-turso = { path = "crates/temper-store-turso", features = ["cloud"] }
temper-store-redis = { path = "crates/temper-store-redis" }
temper-store-sim = { path = "crates/temper-store-sim" }
temper-server = { path = "crates/temper-server" }
temper-cli = { path = "crates/temper-cli" }
temper-mcp = { path = "crates/temper-mcp" }
temper-evolution = { path = "crates/temper-evolution" }
temper-jit = { path = "crates/temper-jit" }
temper-optimize = { path = "crates/temper-optimize" }
temper-platform = { path = "crates/temper-platform" }
temper-wasm = { path = "crates/temper-wasm" }
temper-wasm-sdk = { path = "crates/temper-wasm-sdk" }
temper-sdk = { path = "crates/temper-sdk" }
temper-sandbox = { path = "crates/temper-sandbox" }
temper-ots = { path = "crates/temper-ots" }
temper-transport = { path = "crates/temper-transport" }
temper-actor-runtime = { path = "crates/temper-actor-runtime" }
temper-agents = { path = "crates/temper-agents" }

# WASM runtime. Floor is 36.0.13: 36.0.7 fixes RUSTSEC-2026-0096 (the ARN-169
# objective), and 36.0.13 additionally fixes RUSTSEC-2026-0222, so the lower bound
# must not admit an earlier 36.x patch.
wasmtime = { version = "36.0.13", features = ["component-model", "profiling"] }
wasmtime-wasi = "36.0.13"
sha2 = "0.10"
hostname = "0.4"
aes-gcm = "0.10"
async-trait = "0.1"
tikv-jemallocator = { version = "0.6", features = ["stats"] }
lru = "0.12"
libc = "0.2"

# Keep useful file/line backtraces without copying full type/variable debug
# information into every workspace integration-test executable. The test
# profile inherits the debug settings; development stays incremental.
[profile.dev]
debug = "line-tables-only"

# Full-workspace tests favor a compact cold build over incremental compiler
# state. Keep this separate from the ordinary development/editing profile.
[profile.test]
incremental = false
codegen-units = 16
lto = "off"

# These small runtime/specification crates are exercised on every simulated
# operation. Keep ordinary development unoptimized and all test checks enabled.
[profile.test.package.temper-runtime]
opt-level = 1

[profile.test.package.temper-jit]
opt-level = 1

[profile.test.package.temper-spec]
opt-level = 1

[profile.test.package.temper-integration-tests]
opt-level = 1

# Connection-lifetime profiles spend time throughout the embedded SQL engine.
# Optimize test execution without changing engine source or development checks.
[profile.test.package.turso_core]
opt-level = 1

# Keep workspace backtraces, but do not duplicate third-party dependency debug
# sections in every test executable. See docs/testing.md for the debugger opt-in.
[profile.dev.package."*"]
debug = false

# These dependencies are compilers executed by the tests, not just build-time
# dependencies. Optimizing them makes runtime WASM compilation substantially
# cheaper without optimizing application code or removing debug assertions.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

# Parsing and hashing are hot paths in full-seed simulations. Level 1 keeps
# generic code sharing and a modest compile cost; application code stays at 0.
[profile.dev.package.toml]
opt-level = 1

[profile.dev.package.toml_edit]
opt-level = 1

[profile.dev.package.quick-xml]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3

# Profiles of full-seed simulations also expose unoptimized byte-scanning and
# RNG primitive helpers. Keep application code and development checks intact.
[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.rand_core]
opt-level = 3

# Full blob simulations serialize and validate large JSON values. Optimize the
# serializer while retaining generic code sharing and all development checks.
[profile.dev.package.serde_json]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Rust consumers need neither SDK's standalone C dynamic/static artifacts.
# The exact published source is retained with manifest-only packaging changes.
[patch.crates-io]
turso_sdk_kit = { path = "vendor/turso-sdk-kit" }
turso_sync_sdk_kit = { path = "vendor/turso-sync-sdk-kit" }
# Keep native-job polling responsive without changing Cargo's jobserver budget.
cc = { path = "vendor/cc" }
