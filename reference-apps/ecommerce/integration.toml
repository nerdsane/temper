# Integration deployment configuration for the e-commerce reference app.
#
# Example direct IntegrationEngine configuration. Production entity transitions
# do not load or feed this file automatically; explicit caller wiring is required.
# This is deployment-specific configuration, not IOA webhook syntax.

[[webhook]]
name = "notify_fulfillment"
url = "https://fulfillment.example.com/orders"
method = "POST"
timeout_ms = 5000
max_retries = 3

[[webhook]]
name = "charge_payment"
url = "https://payments.example.com/charge"
method = "POST"
timeout_ms = 10000
max_retries = 5

[[webhook]]
name = "notify_shipping"
url = "https://shipping.example.com/notify"
method = "POST"
timeout_ms = 5000
max_retries = 3
