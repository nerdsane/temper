# ReadersWriters Entity - I/O Automaton Specification
#
# Faithful Temper port of the Quint ReadersWriters example:
#   readers: Set[int]
#   writers: Set[int]
#   waiting: List[(str, int)]
#
# The detailed set/list transition relation is computed by the
# readers_writers_step WASM module. Temper commits only narrow validated
# callbacks whose guards/effects preserve the safety-critical projection.

[automaton]
name = "ReadersWriters"
states = ["Idle", "Reading", "Writing"]
initial = "Idle"

# --- Projected state variables verified by Temper ---

[[state]]
name = "reader_count"
type = "counter"
initial = "0"

[[state]]
name = "writer_count"
type = "counter"
initial = "0"

[[state]]
name = "waiting_count"
type = "counter"
initial = "0"

[[state]]
name = "wasm_in_flight"
type = "bool"
initial = "false"

# --- Public protocol actions ---

[[action]]
name = "TryRead"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "!wasm_in_flight"
effect = ["wasm_in_flight = true"]
params = ["actor"]
hint = "Append ('read', actor) to the FIFO waiting queue if the actor is not already waiting to read."

[[action.triggers]]
name = "step"
kind = "wasm"
module = "readers_writers_step"
on_success = "ValidateProposal"
on_failure = "StepFailed"

[[action]]
name = "TryWrite"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "!wasm_in_flight"
effect = ["wasm_in_flight = true"]
params = ["actor"]
hint = "Append ('write', actor) to the FIFO waiting queue if the actor is not already waiting to write."

[[action.triggers]]
name = "step"
kind = "wasm"
module = "readers_writers_step"
on_success = "ValidateProposal"
on_failure = "StepFailed"

[[action]]
name = "ReadOrWrite"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "!wasm_in_flight"
effect = ["wasm_in_flight = true"]
hint = "Serve the head of the FIFO waiting queue if the head request is enabled."

[[action.triggers]]
name = "step"
kind = "wasm"
module = "readers_writers_step"
on_success = "ValidateProposal"
on_failure = "StepFailed"

[[action]]
name = "Stop"
kind = "input"
from = ["Reading", "Writing"]
guard = "!wasm_in_flight"
effect = ["wasm_in_flight = true"]
params = ["actor"]
hint = "Stop one active reader or writer."

[[action.triggers]]
name = "step"
kind = "wasm"
module = "readers_writers_step"
on_success = "ValidateProposal"
on_failure = "StepFailed"

# --- Proposal validation action ---

[[action]]
name = "ValidateProposal"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "wasm_in_flight"
params = ["proposed_readers", "proposed_writers", "proposed_waiting", "last_step", "actor"]
hint = "Validate a WASM proposal against the current detailed fields, then dispatch a narrow commit callback."

[[action.triggers]]
name = "validate"
kind = "wasm"
module = "readers_writers_step"
on_failure = "StepFailed"

# --- Narrow commit callbacks ---

[[action]]
name = "Enqueued"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "wasm_in_flight"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["waiting_count += 1", "wasm_in_flight = false"]
hint = "A request was appended to the waiting queue. Active readers/writers are unchanged."

[[action]]
name = "Unchanged"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "wasm_in_flight"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["wasm_in_flight = false"]
hint = "The Quint transition was a no-op, for example a duplicate TryRead/TryWrite."

[[action]]
name = "ReaderStartedFromIdle"
kind = "input"
from = ["Idle"]
to = "Reading"
guard = "wasm_in_flight && waiting_count >= 1"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["reader_count += 1", "waiting_count -= 1", "wasm_in_flight = false"]
hint = "The FIFO queue head was a read request and the resource had no active users."

[[action]]
name = "ReaderStartedFromReading"
kind = "input"
from = ["Reading"]
to = "Reading"
guard = "wasm_in_flight && waiting_count >= 1"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["reader_count += 1", "waiting_count -= 1", "wasm_in_flight = false"]
hint = "The FIFO queue head was a read request and readers were already active."

[[action]]
name = "WriterStarted"
kind = "input"
from = ["Idle"]
to = "Writing"
guard = "wasm_in_flight && waiting_count >= 1"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["writer_count += 1", "waiting_count -= 1", "wasm_in_flight = false"]
hint = "The FIFO queue head was a write request and the resource was idle."

[[action]]
name = "ReaderStoppedMoreRemain"
kind = "input"
from = ["Reading"]
guard = "wasm_in_flight && reader_count >= 2"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["reader_count -= 1", "wasm_in_flight = false"]
hint = "One reader stopped and at least one reader remains active."

[[action]]
name = "ReaderStoppedLast"
kind = "input"
from = ["Reading"]
to = "Idle"
guard = "wasm_in_flight && reader_count >= 1 && reader_count < 2"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["reader_count -= 1", "wasm_in_flight = false"]
hint = "The final active reader stopped."

[[action]]
name = "WriterStopped"
kind = "input"
from = ["Writing"]
to = "Idle"
guard = "wasm_in_flight && writer_count >= 1"
params = ["readers", "writers", "waiting", "last_step", "actor"]
effect = ["writer_count -= 1", "wasm_in_flight = false"]
hint = "The active writer stopped."

[[action]]
name = "Rejected"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "wasm_in_flight"
params = ["error", "last_step", "actor"]
effect = ["wasm_in_flight = false"]
hint = "The requested step was disabled or failed proposal validation. No protocol state is committed."

[[action]]
name = "StepFailed"
kind = "input"
from = ["Idle", "Reading", "Writing"]
guard = "wasm_in_flight"
params = ["error", "integration"]
effect = ["wasm_in_flight = false"]
hint = "The readers_writers_step WASM module failed before producing a proposal or validation result."

# --- Safety invariants ---

[[invariant]]
name = "NoReaderWriterOverlap"
assert = "reader_count == 0 || writer_count == 0"

[[invariant]]
name = "AtMostOneWriter"
assert = "writer_count <= 1"

[[invariant]]
name = "IdleMeansNoActiveActors"
assert = "status in ['Idle'] => reader_count == 0 && writer_count == 0"

[[invariant]]
name = "ReadingMeansReadersOnly"
assert = "status in ['Reading'] => reader_count > 0 && writer_count == 0"

[[invariant]]
name = "WritingHasWriter"
assert = "status in ['Writing'] => reader_count == 0 && writer_count > 0"
