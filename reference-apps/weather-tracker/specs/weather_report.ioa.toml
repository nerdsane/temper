[automaton]
name = "WeatherReport"
states = ["Collecting", "Fetching", "Ready", "Archived"]
initial = "Collecting"

[[action]]
name = "FetchWeatherData"
kind = "input"
from = ["Collecting"]
to = "Fetching"
hint = "Initiate weather data fetch from Open-Meteo API for this report's location."

# ADR-0046: inline trigger — replaces the top-level [[integration]] block
# below. Post-parse expansion synthesizes an Integration + trigger effect,
# so the existing WASM runtime picks it up with zero behavioral change.
[[action.triggers]]
name = "fetch_open_meteo"
kind = "wasm"
module = "fetch_open_meteo"
on_success = "FetchSucceeded"
on_failure = "FetchFailed"

[[action]]
name = "FetchSucceeded"
kind = "input"
from = ["Fetching"]
to = "Ready"
params = ["Temperature", "Humidity", "WindSpeed", "Precipitation", "Conditions"]
hint = "Callback from WASM module with weather data from Open-Meteo."

[[action]]
name = "FetchFailed"
kind = "input"
from = ["Fetching"]
to = "Collecting"
hint = "Callback when Open-Meteo fetch fails. Returns to Collecting for retry."

[[action]]
name = "ArchiveReport"
kind = "input"
from = ["Ready"]
to = "Archived"
hint = "Move this report to historical archives."

[[invariant]]
name = "ArchivedIsTerminal"
when = ["Archived"]
assert = "no_further_transitions"

[[liveness]]
name = "EventuallyReady"
from = ["Collecting"]
reaches = ["Ready", "Archived"]

# ADR-0046: [[integration]] block removed; replaced by [[action.triggers]]
# on FetchWeatherData above. Post-parse expansion synthesizes the
# equivalent integration automatically.
