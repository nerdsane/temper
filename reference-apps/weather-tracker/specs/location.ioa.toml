[automaton]
name = "Location"
states = ["Active", "Paused", "Removed"]
initial = "Active"
terminal = ["Removed"]

[[action]]
name = "PauseTracking"
kind = "input"
from = ["Active"]
to = "Paused"
hint = "Temporarily stop tracking weather for this location."

[[action]]
name = "ResumeTracking"
kind = "input"
from = ["Paused"]
to = "Active"
hint = "Resume tracking weather for this location."

[[action]]
name = "RemoveLocation"
kind = "input"
from = ["Active", "Paused"]
to = "Removed"
hint = "Permanently stop tracking this location."

[[liveness]]
# An active location can always still be removed. Not `reaches`: tracking
# can be paused and resumed forever.
name = "CanBeRemoved"
from = ["Active"]
can_reach = ["Removed"]
