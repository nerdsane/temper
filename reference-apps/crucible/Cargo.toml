[package]
name = "crucible-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Reference agent-runtime control plane demonstrating cross-field validation via IOA field invariants on Temper"
default-run = "crucible-chat"

[lib]
path = "src/lib.rs"

[[bin]]
name = "crucible-chat"
path = "src/bin/crucible_chat.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
glob = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
hyper = { workspace = true }
temper-jit = { path = "../../crates/temper-jit" }
temper-runtime = { path = "../../crates/temper-runtime" }
temper-authz = { path = "../../crates/temper-authz" }
temper-server = { path = "../../crates/temper-server" }
temper-verify = { path = "../../crates/temper-verify" }
temper-spec = { path = "../../crates/temper-spec" }
tower = { workspace = true }
