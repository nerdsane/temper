# SessionResource Entity — I/O Automaton Specification
#
# Child entity of Session representing one row in the `resources[]`
# collection of Anthropic's Beta Managed Agents Sessions API. `resources`
# is a type-tagged sum with two variants:
#
#   github_repository — requires `Url`; may carry `CheckoutKind` + `CheckoutRef`
#   file              — requires `FileId`; forbids github fields
#
# Crucible collapses the sum into a single table with a `Kind` discriminator
# and uses field invariants to enforce the shape of each branch, mirroring
# AgentTool's approach (see ADR-0043 Sub-Decision 5).
#
# A cross-invariant in cross-invariants.toml gates child writes on the
# parent Session's Status (non-Archived, non-Terminated).

[automaton]
name = "SessionResource"
states = ["Active"]
initial = "Active"

# --- Cross-field validation (ADR-0041) ---

[[field_invariant]]
name = "KindMustBeKnown"
message = "SessionResource.Kind must be `github_repository`, `file`, or `memory_store`"
assert = "Kind != null => Kind in ['github_repository', 'file', 'memory_store']"

[[field_invariant]]
name = "GithubResourceRequiresUrl"
message = "github_repository resources must have a non-empty Url"
assert = "Kind == 'github_repository' => !empty(Url)"

[[field_invariant]]
name = "GithubResourceForbidsFileId"
message = "github_repository resources must not set FileId"
assert = "Kind == 'github_repository' => FileId == null"

[[field_invariant]]
name = "FileResourceRequiresFileId"
message = "file resources must have a non-empty FileId"
assert = "Kind == 'file' => !empty(FileId)"

[[field_invariant]]
name = "FileResourceForbidsGithubFields"
message = "file resources must not set Url/CheckoutKind/CheckoutRef"
assert = "Kind == 'file' => Url == null && CheckoutKind == null && CheckoutRef == null"

[[field_invariant]]
name = "CheckoutKindMustBeKnown"
message = "SessionResource.CheckoutKind must be `branch` or `commit`"
assert = "CheckoutKind != null => CheckoutKind in ['branch', 'commit']"

[[field_invariant]]
name = "CheckoutRefRequiresCheckoutKind"
message = "SessionResource.CheckoutRef requires CheckoutKind to be set"
assert = "CheckoutRef != null => CheckoutKind != null"

# --- memory_store kind ---

[[field_invariant]]
name = "MemoryStoreResourceRequiresMemoryStoreId"
message = "memory_store resources must have a non-empty MemoryStoreId"
assert = "Kind == 'memory_store' => !empty(MemoryStoreId)"

[[field_invariant]]
name = "MemoryStoreAccessMustBeKnown"
message = "SessionResource.Access must be read_write or read_only"
assert = "Kind == 'memory_store' && Access != null => Access in ['read_write', 'read_only']"

[[field_invariant]]
name = "MemoryStoreResourceForbidsFileFields"
message = "memory_store resources must not set Url/CheckoutKind/CheckoutRef/FileId"
assert = "Kind == 'memory_store' => Url == null && CheckoutKind == null && CheckoutRef == null && FileId == null"
