# Environment Entity — I/O Automaton Specification
#
# A Crucible Environment models one agent execution context. Its lifecycle is
# trivially simple (Active → Archived) because the interesting behaviour lives
# in field invariants, not state transitions. The three `[[field_invariant]]`
# sections at the bottom of this file enforce Crucible's hard Local constraint:
# a Local environment cannot set any of the cloud-only networking fields.
#
# See `docs/adrs/0042-crucible-reference-app.md` for why this shape.

[automaton]
name = "Environment"
states = ["Active", "Archived"]
initial = "Active"
terminal = ["Archived"]

# --- Actions ---

[[action]]
name = "ArchiveEnvironment"
kind = "input"
from = ["Active"]
to = "Archived"
hint = "Archive the environment. Retains history but makes the environment non-operational."

[[action]]
name = "EnvironmentArchivedEvent"
kind = "output"
hint = "Emitted when the environment is archived."

# --- Cross-field validation (ADR-0041) ---
#
# Local environments are the real happy path for this reference app
# (Temper runs on the developer's machine), so `Local` is first-class.
# The three invariants below reject combinations that only make sense
# for Modal environments — setting any of them on a Local environment
# returns 409 ConstraintViolation with `error.details.type == "field_invariant"`.

[[field_invariant]]
name = "LocalNetworkingMustBeUnrestricted"
message = "Local environments must use Unrestricted networking"
assert = "ConfigType == 'Local' => NetworkingType == 'Unrestricted'"

[[field_invariant]]
name = "LocalCannotAllowMcpServers"
message = "Local environments cannot set allow_mcp_servers"
assert = "ConfigType == 'Local' => AllowMcpServers in [null, false]"

[[field_invariant]]
name = "LocalCannotAllowPackageManagers"
message = "Local environments cannot set allow_package_managers"
assert = "ConfigType == 'Local' => AllowPackageManagers in [null, false]"

# Local environments cannot set Modal-specific columns. These fields only
# make sense when ConfigType=Modal; setting them on a Local environment is
# a client error (likely a copy-paste from a Modal config).
[[field_invariant]]
name = "LocalCannotSetModalFields"
message = "Local environments cannot set Modal configuration fields (ModalImage, ModalCpu, etc.)"
assert = "ConfigType == 'Local' => ModalImage in [null] && ModalCpu in [null] && ModalMemory in [null] && ModalTimeout in [null] && ModalGpu in [null] && ModalWorkdir in [null] && ModalBlockNetwork in [null]"

# --- Modal environment constraints ---
#
# Modal environments provision a remote sandbox on Modal.com. Networking
# isolation is managed by Modal itself (block_network / cidr_allowlist), so
# the Crucible-level NetworkingType must be Unrestricted. MCP servers and
# package managers are not supported — packages are baked into the Modal
# image at creation time.

[[field_invariant]]
name = "ModalNetworkingMustBeUnrestricted"
message = "Modal environments must use Unrestricted networking (Modal manages isolation internally)"
assert = "ConfigType == 'Modal' => NetworkingType == 'Unrestricted'"

[[field_invariant]]
name = "ModalCannotAllowMcpServers"
message = "Modal environments cannot set allow_mcp_servers"
assert = "ConfigType == 'Modal' => AllowMcpServers in [null, false]"

[[field_invariant]]
name = "ModalCannotAllowPackageManagers"
message = "Modal environments do not use runtime package managers (bake packages into ModalImage)"
assert = "ConfigType == 'Modal' => AllowPackageManagers in [null, false]"
