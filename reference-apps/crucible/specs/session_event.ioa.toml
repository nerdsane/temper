# SessionEvent Entity — I/O Automaton Specification
#
# Append-only child of Session. Full coverage of Anthropic's
# `GET /v1/sessions/{id}/events` feed — 24 event types (20 base from
# ADR-0045 + 4 thread events for multi-agent delegation) collapsed
# into a single table with a `Kind` discriminator:
#
#   User events (4) — POSTable via /v1/sessions/{id}/events:
#     user.message            — text + content blocks from the user
#     user.interrupt          — user interrupted the agent
#     user.tool_confirmation  — user allow/deny for a tool ask
#     user.custom_tool_result — result of a custom tool invocation
#
#   Agent events (8) — emitted by the agent loop:
#     agent.message                  — agent response text + content blocks
#     agent.thinking                 — agent's extended thinking
#     agent.custom_tool_use          — agent invoked a custom tool
#     agent.tool_use                 — agent invoked a built-in tool
#     agent.tool_result              — result of a built-in tool
#     agent.mcp_tool_use             — agent invoked an MCP tool
#     agent.mcp_tool_result          — MCP tool result
#     agent.thread_context_compacted — session context summarization happened
#
#   Session status events (5) — pulses mirroring session state:
#     session.status_running      — session actively working
#     session.status_idle         — agent paused, awaiting input (has StopReason)
#     session.status_rescheduled  — recovering from error state
#     session.status_terminated   — session ended
#     session.deleted             — tombstone (manual; no auto-emit on DELETE)
#
#   Thread events (4) — multi-agent delegation:
#     session.thread_created         — a delegation thread was created
#     session.thread_idle            — a delegation thread idled
#     agent.thread_message_sent      — coordinator sent a message to a sub-agent
#     agent.thread_message_received  — coordinator received a result from a sub-agent
#
#   Error event (1):
#     session.error               — error variant + retry status
#
#   Span events (2) — observability:
#     span.model_request_start    — model request initiated
#     span.model_request_end      — model request completed, carries usage
#
# Crucible collapses the 20-branch sum into a single table with a `Kind`
# discriminator, same pattern as AgentTool, SessionResource, and
# AgentVersion. Queryable attributes (ToolUseId, ToolName, McpServerName,
# IsError, ConfirmationResult, EvaluatedPermission, DenyMessage,
# CustomToolUseId, McpToolUseId, StopReason, StopReasonEventIds,
# ErrorKind, ErrorMessage, RetryStatus, ModelRequestStartId,
# ModelInputTokens, ModelOutputTokens, ModelCacheCreationInputTokens,
# ModelCacheReadInputTokens, ModelSpeed) are hoisted out of the event
# payload into scalar columns. The full event payload lives in an opaque
# `Content` JSON blob, same shape as AgentVersion.Snapshot.
#
# Append-only semantics are enforced by a permissive Cedar stub that
# allows POST but denies PATCH, mirroring AgentVersion.
#
# A cross-invariant in cross-invariants.toml gates writes on the parent
# Session being non-Archived. Events are still accepted on Terminated
# sessions because agents often emit trailing messages after termination.
#
# Divergences from Anthropic documented in ADR-0045.

[automaton]
name = "SessionEvent"
states = ["Active"]
initial = "Active"

# --- Cross-field validation (ADR-0041, ADR-0045) ---

# --- Kind discriminator (20-way) ---

[[field_invariant]]
name = "KindMustBeKnown"
message = "SessionEvent.Kind must be one of the 24 documented event kinds"
assert = "Kind != null => Kind in ['user.message', 'user.interrupt', 'user.tool_confirmation', 'user.custom_tool_result', 'agent.message', 'agent.thinking', 'agent.custom_tool_use', 'agent.tool_use', 'agent.tool_result', 'agent.mcp_tool_use', 'agent.mcp_tool_result', 'agent.thread_context_compacted', 'session.status_running', 'session.status_idle', 'session.status_rescheduled', 'session.status_terminated', 'session.deleted', 'session.error', 'span.model_request_start', 'span.model_request_end', 'session.thread_created', 'session.thread_idle', 'agent.thread_message_sent', 'agent.thread_message_received']"

# --- User event rules ---

[[field_invariant]]
name = "UserToolConfirmationRequiresToolUseId"
message = "user.tool_confirmation events must reference a ToolUseId"
assert = "Kind == 'user.tool_confirmation' => !empty(ToolUseId)"

[[field_invariant]]
name = "UserToolConfirmationRequiresResult"
message = "user.tool_confirmation events must set ConfirmationResult"
assert = "Kind == 'user.tool_confirmation' => ConfirmationResult != null"

[[field_invariant]]
name = "DenyConfirmationRequiresDenyMessage"
message = "user.tool_confirmation with ConfirmationResult=deny must set DenyMessage"
assert = "ConfirmationResult == 'deny' => !empty(DenyMessage)"

[[field_invariant]]
name = "UserCustomToolResultRequiresCustomToolUseId"
message = "user.custom_tool_result events must reference a CustomToolUseId"
assert = "Kind == 'user.custom_tool_result' => !empty(CustomToolUseId)"

# --- Agent event rules ---

[[field_invariant]]
name = "AgentCustomToolUseRequiresName"
message = "agent.custom_tool_use events must set ToolName"
assert = "Kind == 'agent.custom_tool_use' => !empty(ToolName)"

[[field_invariant]]
name = "AgentToolUseRequiresName"
message = "agent.tool_use events must set ToolName"
assert = "Kind == 'agent.tool_use' => !empty(ToolName)"

[[field_invariant]]
name = "AgentToolResultRequiresToolUseId"
message = "agent.tool_result events must reference a ToolUseId"
assert = "Kind == 'agent.tool_result' => !empty(ToolUseId)"

[[field_invariant]]
name = "AgentMcpToolUseRequiresName"
message = "agent.mcp_tool_use events must set ToolName"
assert = "Kind == 'agent.mcp_tool_use' => !empty(ToolName)"

[[field_invariant]]
name = "AgentMcpToolUseRequiresServerName"
message = "agent.mcp_tool_use events must set McpServerName"
assert = "Kind == 'agent.mcp_tool_use' => !empty(McpServerName)"

[[field_invariant]]
name = "AgentMcpToolResultRequiresMcpToolUseId"
message = "agent.mcp_tool_result events must reference an McpToolUseId"
assert = "Kind == 'agent.mcp_tool_result' => !empty(McpToolUseId)"

# --- Thread event rules (multi-agent delegation) ---

[[field_invariant]]
name = "ThreadCreatedRequiresThreadId"
message = "session.thread_created events must set SessionThreadId"
assert = "Kind == 'session.thread_created' => !empty(SessionThreadId)"

[[field_invariant]]
name = "ThreadIdleRequiresThreadId"
message = "session.thread_idle events must set SessionThreadId"
assert = "Kind == 'session.thread_idle' => !empty(SessionThreadId)"

[[field_invariant]]
name = "ThreadMessageSentRequiresThreadId"
message = "agent.thread_message_sent events must set SessionThreadId"
assert = "Kind == 'agent.thread_message_sent' => !empty(SessionThreadId)"

[[field_invariant]]
name = "ThreadMessageReceivedRequiresThreadId"
message = "agent.thread_message_received events must set SessionThreadId"
assert = "Kind == 'agent.thread_message_received' => !empty(SessionThreadId)"

# --- Enum-value sanity rules ---

[[field_invariant]]
name = "ConfirmationResultMustBeKnown"
message = "SessionEvent.ConfirmationResult must be `allow` or `deny`"
assert = "ConfirmationResult != null => ConfirmationResult in ['allow', 'deny']"

[[field_invariant]]
name = "EvaluatedPermissionMustBeKnown"
message = "SessionEvent.EvaluatedPermission must be `allow`, `ask`, or `deny`"
assert = "EvaluatedPermission != null => EvaluatedPermission in ['allow', 'ask', 'deny']"

# --- Session status event rules ---

[[field_invariant]]
name = "StatusIdleRequiresStopReason"
message = "session.status_idle events must set StopReason"
assert = "Kind == 'session.status_idle' => !empty(StopReason)"

[[field_invariant]]
name = "StopReasonMustBeKnown"
message = "SessionEvent.StopReason must be `end_turn`, `requires_action`, or `retries_exhausted`"
assert = "StopReason != null => StopReason in ['end_turn', 'requires_action', 'retries_exhausted']"

[[field_invariant]]
name = "RequiresActionRequiresEventIds"
message = "session.status_idle with StopReason=requires_action must set StopReasonEventIds"
assert = "Kind == 'session.status_idle' && StopReason == 'requires_action' => !empty(StopReasonEventIds)"

# --- session.error rules ---

[[field_invariant]]
name = "SessionErrorRequiresKind"
message = "session.error events must set ErrorKind"
assert = "Kind == 'session.error' => !empty(ErrorKind)"

[[field_invariant]]
name = "SessionErrorRequiresMessage"
message = "session.error events must set ErrorMessage"
assert = "Kind == 'session.error' => !empty(ErrorMessage)"

[[field_invariant]]
name = "SessionErrorRequiresRetryStatus"
message = "session.error events must set RetryStatus"
assert = "Kind == 'session.error' => !empty(RetryStatus)"

[[field_invariant]]
name = "ErrorKindMustBeKnown"
message = "SessionEvent.ErrorKind must be one of the 7 documented error variants"
assert = "ErrorKind != null => ErrorKind in ['unknown_error', 'model_overloaded_error', 'model_rate_limited_error', 'model_request_failed_error', 'mcp_connection_failed_error', 'mcp_authentication_failed_error', 'billing_error']"

[[field_invariant]]
name = "RetryStatusMustBeKnown"
message = "SessionEvent.RetryStatus must be `retrying`, `exhausted`, or `terminal`"
assert = "RetryStatus != null => RetryStatus in ['retrying', 'exhausted', 'terminal']"

[[field_invariant]]
name = "McpErrorRequiresServerName"
message = "MCP error kinds must identify the failing McpServerName"
assert = "ErrorKind in ['mcp_connection_failed_error', 'mcp_authentication_failed_error'] => !empty(McpServerName)"

# --- span.model_request_end rules ---

[[field_invariant]]
name = "ModelRequestEndRequiresStartId"
message = "span.model_request_end events must reference ModelRequestStartId"
assert = "Kind == 'span.model_request_end' => !empty(ModelRequestStartId)"

[[field_invariant]]
name = "ModelRequestEndRequiresIsError"
message = "span.model_request_end events must set IsError"
assert = "Kind == 'span.model_request_end' => IsError != null"

[[field_invariant]]
name = "ModelSpeedMustBeKnown"
message = "SessionEvent.ModelSpeed must be `standard` or `fast`"
assert = "ModelSpeed != null => ModelSpeed in ['standard', 'fast']"
