# Fork contributions are inspected as data; never execute their code in this workflow.
# The review gate: no merge without a valid review record for this head.
# Vendor as .github/workflows/sdlc-review.yml.
#
# THE GATE VALIDATES; IT NEVER SPAWNS. The implementer agent owns the review the
# way it owns the effort: it runs the panel (interrogate locally, or
# stack/review/run-cloud-panel.py on a computer copy), aggregates, and posts the
# record to the PR (stack/review/post-review-record.sh). This gate checks that a
# record exists for the head being merged, applies owner RESOLVE adjudications,
# and validates the panel and findings. The authorized effort owns the merge;
# this trusted validator does not merge contributions.
#
# A red gate with "no record" is an instruction to the owner, not a failure of
# the pipeline: run the panel, post the record. Rabbit-hole detection and the
# arbiter are the owner agent's tools (arni-mode babysit playbook), not CI steps.
name: sdlc-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, edited]
concurrency:
  group: sdlc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write          # label create/apply is the Issues API
jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Start the gate on the contributor commit
        id: contributor_check
        uses: actions/github-script@v7
        with:
          script: |
            const {data: check} = await github.rest.checks.create({
              ...context.repo, name: 'review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            core.setOutput('check_id', check.id);
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fetch contribution objects without checking out its code
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUM" =~ ^[0-9]+$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUM}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD" || {
            echo "::error::PR changed during this run; use the latest event"; exit 1;
          }
      - name: Fetch the review toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN is missing from the trusted base-repository gate configuration"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack"; exit 1; }
      - name: Read exact-head owner waiver
        id: owner_waiver
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: python3 /tmp/stack/review/owner_waiver.py
      - name: Find the record for this head
        if: steps.owner_waiver.outputs.accepted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          body=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{n}/comments",
                              "--paginate","-q",".[].body"],capture_output=True,text=True).stdout
          import base64
          rec=None
          def _consider(txt):
              global rec
              try:
                  cand=json.loads(base64.b64decode(txt).decode())
              except Exception:
                  return
              if cand.get("commit")==head: rec=cand
          for m in re.finditer(r"<!--\s*sdlc-review-record-b64\s*([A-Za-z0-9+/=\s]+?)\s*-->", body):
              _consider(m.group(1).strip())
          if not rec:
              print(f"::error::no review record for head {head[:10]}. Owner: run the panel "
                    "(interrogate, or stack/review/run-cloud-panel.py on a computer copy) and post it "
                    "(stack/review/post-review-record.sh). This gate validates records; it does not produce them.")
              sys.exit(1)
          os.makedirs(".review",exist_ok=True)
          json.dump(rec, open(".review/review.json","w"))
          print("record found for the current head")
          PY
      - name: Merge Greptile findings into the record
        if: steps.owner_waiver.outputs.accepted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          r=json.load(open(".review/review.json")); n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          out=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/reviews",
                              "--paginate","-q",'.[] | select(.user.login|test("greptile";"i")) | .commit_id'],
                             capture_output=True,text=True).stdout
          if head in out:
              r.setdefault("reviewers_ran",[])
              if "greptile" not in r["reviewers_ran"]: r["reviewers_ran"].append("greptile")
          else:
              r.setdefault("reviewers_skipped",[]).append(
                  {"reviewer":"greptile","reason":"no Greptile review of this head yet"})
          json.dump(r,open(".review/review.json","w"),indent=2)
          PY
      - name: Apply owner adjudications (RESOLVE comments)
        if: steps.owner_waiver.outputs.accepted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          # A ruling is a comment that BEGINS with RESOLVE: lines, written by the
          # repo owner, a member or a collaborator - anyone else's RESOLVE: is
          # discussion. A quoted RESOLVE: mid-comment is never a ruling: the
          # first non-RESOLVE line ends the rulings. Every ruling names the head
          # it is for: RESOLVE: <file:line> @<head-sha> <reason>
          raw=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{n}/comments",
                              "--paginate","-q",'.[] | select(.author_association=="OWNER" or .author_association=="MEMBER" or .author_association=="COLLABORATOR") | .body | @base64'],
                             capture_output=True,text=True).stdout
          import base64 as _b64
          comments=[_b64.b64decode(l).decode() for l in raw.split() if l]
          # A ruling is bound to one head: "RESOLVE: <target> @<sha-prefix> <reason>".
          # Without the @sha it is ignored, so a ruling on one head can never
          # silently clear a later one - the code after it has not been ruled on.
          resolutions={}
          for c in comments:
              if not c.strip().startswith("RESOLVE:"): continue
              for line in c.strip().splitlines():
                  m = re.match(r"RESOLVE:\s*(\S+)\s+@([0-9a-fA-F]{7,40})\s+(.+)$", line)
                  if not m:
                      if line.startswith("RESOLVE:"): print(f"ignored ruling without @<head-sha>: {line[:80]}")
                      break
                  if not head.lower().startswith(m.group(2).lower()):
                      print(f"ruling for another head ({m.group(2)}), ignored: {line[:80]}"); continue
                  resolutions[m.group(1)]=m.group(3).strip()
          if resolutions:
              r=json.load(open(".review/review.json")); hit=0
              for f in r.get("findings",[]):
                  fl=f.get("file_line","")
                  if fl in resolutions and not f.get("resolved"):
                      f["resolved"]=True; f["resolution"]=f"owner adjudication: {resolutions[fl]}"; hit+=1
              # "RESOLVE: fix-it @<head-sha> <reason>" is the owner overruling
              # the fix-it rubric for this head only. After the two-round cap it
              # is how "merge" becomes executable without forging a record; the
              # reason stays on the record.
              if "fix-it" in resolutions and r.get("fix_it_failed"):
                  r["fix_it_failed"]=False
                  r["fix_it_overruled"]=f"owner adjudication: {resolutions['fix-it']}"; hit+=1
              json.dump(r,open(".review/review.json","w"),indent=2)
              print(f"adjudications applied: {hit}")
          PY
      - name: Validate the record (the gate)
        if: steps.owner_waiver.outputs.accepted != 'true'
        id: validate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # Repo variable. Unset means the model majority. Set to 1 where records
          # come from the shared computer and not every reviewer CLI is logged in.
          SDLC_MIN_MODEL_REVIEWERS: ${{ vars.SDLC_MIN_MODEL_REVIEWERS }}
        run: python3 /tmp/stack/review/validate.py .review/review.json --require-commit "$PR_HEAD"
      - name: Retain human control of previously armed auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RISK=$(python3 -c "import json, pathlib; p=pathlib.Path('.review/owner-waiver.json'); r={} if p.exists() else json.load(open('.review/review.json')); print('human' if p.exists() or r.get('risk_flags') or r.get('risk')!='low' else 'low')")
          CHANGED=$(git diff --name-only "${PR_BASE}...${PR_HEAD}")
          if [ "$RISK" != "low" ] || grep -q '^\.github/workflows/' <<<"$CHANGED"; then
            ARMED=$(gh pr view "$PR_NUM" --json autoMergeRequest -q '.autoMergeRequest != null')
            if [ "$ARMED" = "true" ]; then
              gh pr merge "$PR_NUM" --disable-auto
            fi
            echo "Human merge authorization required; the owning effort carries the decision."
          fi
      - name: Fold the verdict into a PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('.review/owner-waiver.json')) {
              const w = JSON.parse(fs.readFileSync('.review/owner-waiver.json', 'utf8'));
              const body = `<!-- sdlc-owner-waiver -->\n### Review requirement — OWNER WAIVER\n` +
                `Authorized commit: ${w.commit}\nHistorical reviewed commit: ${w.reviewed_commit}\n` +
                `[Owner decision](${w.source}) · [Original review](${w.historical_source})\n` +
                `No additional model review ran. Other required checks remain in force.`;
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
              return;
            }
            if (!fs.existsSync('.review/review.json')) return;
            const r = JSON.parse(fs.readFileSync('.review/review.json','utf8'));
            const open = (r.findings||[]).filter(f => f.severity==='act-on' && !f.resolved).length;
            const validated = '${{ steps.validate.outcome }}' === 'success';
            const body = "<!-- sdlc-review -->\n" +
              `### Review — ${r.effort}: **${(validated && !open) ? 'PASS' : 'FAIL'}**\n` +
              `Panel: ${(r.reviewers_ran||[]).join(', ')}` +
              (r.reviewers_skipped?.length ? ` (skipped: ${r.reviewers_skipped.map(s=>s.reviewer).join(', ')})` : '') +
              `\nOpen act-on findings: **${open}** · risk: ${r.risk||'?'}\n`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.body.includes('<!-- sdlc-review -->'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
      - name: Report this gate on the contributor commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number
            });
            if (current.head.sha !== pr.head.sha) {
              core.notice('PR head changed; this result cannot authorize the newer commit.');
              return;
            }
            const result = '${{ job.status }}';
            const checkId = Number('${{ steps.contributor_check.outputs.check_id }}');
            const report = {
              ...context.repo, name: 'review', head_sha: pr.head.sha,
              status: 'completed',
              conclusion: result === 'success' ? 'success' :
                result === 'cancelled' ? 'cancelled' : 'failure',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              output: {title: 'review', summary: 'Validated using trusted base-repository gate code.'}
            };
            if (checkId) {
              const {head_sha, ...update} = report;
              await github.rest.checks.update({...update, check_run_id: checkId});
            } else {
              await github.rest.checks.create(report);
            }
