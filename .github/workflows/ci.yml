name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-02-08

jobs:
  verification-contract:
    name: Verification Contract (verification.v1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ordinary-matrix: ${{ steps.validation-matrices.outputs.ordinary }}
      dst-matrix: ${{ steps.validation-matrices.outputs.dst }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical lane contract
        run: python3 scripts/validation.py check
      - name: Generate validation matrices
        id: validation-matrices
        run: |
          echo "ordinary=$(python3 scripts/validation.py list --category ordinary-test --required-pr)" >> "$GITHUB_OUTPUT"
          echo "dst=$(python3 scripts/validation.py list --category dst --required-pr)" >> "$GITHUB_OUTPUT"
      - name: Install git hook wrappers
        run: bash scripts/setup-hooks.sh
      - name: Generate verification.v1 report
        env:
          VERIFICATION_AGENT_PROVIDER: github-actions
          VERIFICATION_AGENT_MODEL: ci
        run: |
          bash scripts/verification-v1-report.sh \
            --session "${{ github.run_id }}" \
            --out verification.v1.json \
            --pretty
      - name: Validate verification.v1 contract
        run: bash scripts/verification-v1-validate.sh verification.v1.json
      - name: Enforce verification policy
        run: |
          jq -e '
            .summary.blocking_failures == 0 and
            .summary.checks_failed == 0
          ' verification.v1.json >/dev/null
          jq '{summary: .summary}' verification.v1.json
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-v1
          path: verification.v1.json

  check:
    name: Compile & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for full workspace builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: check
          components: clippy,rustfmt
      - name: Run formatting lane
        run: python3 scripts/validation.py run fmt
      - name: Run workspace check lane
        run: python3 scripts/validation.py run check
      - name: Run clippy lane
        run: python3 scripts/validation.py run clippy
      - name: Upload compile and lane timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-check-${{ github.run_attempt }}
          path: |
            target/validation-reports/*.json
            target/cargo-timings/
          if-no-files-found: ignore

  integrity:
    name: Integrity & DST Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: integrity
      - name: Run integrity lane
        run: python3 scripts/validation.py run integrity
      - name: Upload lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-integrity-${{ github.run_attempt }}
          path: target/validation-reports/*.json
          if-no-files-found: ignore

  ordinary-tests:
    name: Tests (${{ matrix.lane }})
    needs: verification-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.verification-contract.outputs.ordinary-matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: temper
          POSTGRES_PASSWORD: temper
          POSTGRES_DB: temper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U temper -d temper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space for test artifacts
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: ${{ matrix.lane }}
          wasm-target: ${{ matrix.lane == 'test-server' && 'true' || 'false' }}
      - name: Run ordinary test lane
        run: python3 scripts/validation.py run "${{ matrix.lane }}"
      - name: Upload compile and lane timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            target/validation-reports/*.json
            target/cargo-timings/
          if-no-files-found: ignore

  backend-parity:
    name: Backend Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: temper
          POSTGRES_PASSWORD: temper
          POSTGRES_DB: temper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U temper -d temper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: backend-parity
      - name: Run durable reaction backend parity lane
        env:
          DATABASE_URL: postgres://temper:temper@localhost:5432/temper_test
          REDIS_URL: redis://localhost:6379/0
        run: python3 scripts/validation.py run backend-parity
      - name: Upload lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-backend-parity-${{ github.run_attempt }}
          path: target/validation-reports/*.json
          if-no-files-found: ignore

  observe-tests:
    name: Observe Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: observe-tests
      - name: Run observe-gated test lane
        run: python3 scripts/validation.py run observe-tests
      - name: Upload lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-observe-tests-${{ github.run_attempt }}
          path: target/validation-reports/*.json
          if-no-files-found: ignore

  dst-platform-tests:
    name: DST/Platform Tests (${{ matrix.lane }})
    needs: verification-contract
    runs-on: ubuntu-latest
    # The longest lane has a 20-minute command budget; reserve time for
    # checkout, toolchain setup, report upload, and Rust cache finalization.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.verification-contract.outputs.dst-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: ${{ matrix.lane }}
      - name: Run deterministic simulation lane
        run: python3 scripts/validation.py run "${{ matrix.lane }}"
      - name: Upload lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.lane }}-${{ github.run_attempt }}
          path: target/validation-reports/*.json
          if-no-files-found: ignore

  verify-specs:
    name: Spec Verification (L0-L3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: spec-verification
      - name: Run spec verification lane
        run: python3 scripts/validation.py run spec-verification
      - name: Upload lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-spec-verification-${{ github.run_attempt }}
          path: target/validation-reports/*.json
          if-no-files-found: ignore

  instrumentation-hygiene:
    name: Instrumentation Hygiene (ADR-0052)
    runs-on: ubuntu-latest
    # The lane has a 10-minute command budget; post-job cache finalization
    # must not turn a successful validation into a cancelled job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: instrumentation-hygiene
      - name: Run instrumentation lane
        run: python3 scripts/validation.py run instrumentation-hygiene
      - name: Upload lane timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-instrumentation-${{ github.run_attempt }}
          path: target/validation-reports/*.json
          if-no-files-found: ignore

  bench-build:
    name: Bench Build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-suffix: bench-build
      - name: Run bench compilation lane
        run: python3 scripts/validation.py run bench-build
      - name: Upload compile and lane timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-bench-build-${{ github.run_attempt }}
          path: |
            target/validation-reports/*.json
            target/cargo-timings/
          if-no-files-found: ignore

  validation-summary:
    name: Validation Timing & Coverage Summary
    if: always()
    needs:
      - verification-contract
      - check
      - integrity
      - ordinary-tests
      - backend-parity
      - observe-tests
      - dst-platform-tests
      - verify-specs
      - instrumentation-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download lane reports
        uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: target/downloaded-validation-reports
      - name: Build timing and coverage summary
        run: |
          python3 scripts/validation.py \
            --report-dir target/downloaded-validation-reports \
            summary --require-complete | tee validation-summary.md
          cat validation-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary-${{ github.run_attempt }}
          path: |
            target/downloaded-validation-reports/summary.json
            validation-summary.md
          if-no-files-found: error
