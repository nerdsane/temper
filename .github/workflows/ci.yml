name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-02-08
  # ARN-439: CI-only compile speedups. These are env overrides scoped to CI runners; the
  # developer-local profiles in Cargo.toml are untouched. Swatinem/rust-cache also sets
  # CARGO_INCREMENTAL=0, but we set it here too so it holds for every cargo invocation.
  # line-tables-only debuginfo keeps backtraces (RUST_BACKTRACE=1 above) while cutting the
  # debuginfo that dominates codegen + link time on the compile-heavy jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ─────────────────────────────────────────────────────
  # Gate 0: Workflow files are code (ARN-453: a bad quote in the DST matrix
  # generator shipped once). actionlint + shellcheck on every run: block.
  # ─────────────────────────────────────────────────────
  workflows-lint:
    name: Workflows Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          # style/info-level shellcheck codes are pre-existing noise; errors block
          ./actionlint -color -ignore 'SC2086' -ignore 'SC2012' -ignore 'SC2044' -ignore 'SC2129'

  # ─────────────────────────────────────────────────────
  # Gate 1: Fast checks (seconds)
  # ─────────────────────────────────────────────────────
  check:
    name: Compile & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Free disk space for full workspace tests
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ─────────────────────────────────────────────────────
  # Gate 2: Integrity checks (seconds)
  # ─────────────────────────────────────────────────────
  integrity:
    name: Integrity & DST Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: No TODO/FIXME/HACK in production code
        run: |
          # Strip #[cfg(test)] blocks and proc macro crates before scanning
          FOUND=false
          for f in $(find crates -name '*.rs' -not -path '*/tests/*' -not -name '*_test.rs' -not -name '*_tests.rs' -not -name 'tests.rs' -not -path '*/temper-macros/*'); do
            # Extract only production code (stop at #[cfg(test)])
            PROD_CODE="$(awk '/^#\[cfg\(test\)\]/{exit} {print}' "$f")"
            if echo "$PROD_CODE" | grep -E '(TODO|FIXME|XXX|HACK)\b' | grep -v '// ci-ok' | grep -qv '^[[:space:]]*//' 2>/dev/null; then
              echo "FAIL: $f contains TODO/FIXME/HACK"
              echo "$PROD_CODE" | grep -nE '(TODO|FIXME|XXX|HACK)\b' | grep -v '// ci-ok' | grep -v '^[[:space:]]*//'
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then exit 1; fi
          echo "Integrity check: OK"

      - name: No unwrap() in production code
        run: |
          # Strip #[cfg(test)] blocks and proc macro crates before scanning.
          # Exclude safe unwrap patterns:
          #   - .read().unwrap() / .write().unwrap() / .lock().unwrap() — RwLock/Mutex
          #     (poisoned lock = prior panic, TigerStyle fail-fast is correct)
          #   - .with_ymd_and_hms(...).unwrap() — chrono infallible for valid dates
          FOUND=false
          for f in $(find crates -name '*.rs' -not -path '*/tests/*' -not -name '*_test.rs' -not -name '*_tests.rs' -not -name 'tests.rs' -not -path '*/temper-macros/*' -not -path '*/benches/*'); do
            PROD_CODE="$(awk '/^#\[cfg\(test\)\]/{exit} {print}' "$f")"
            FILTERED="$(echo "$PROD_CODE" | grep '\.unwrap()' | grep -v '// ci-ok' | grep -v '^[[:space:]]*//' | grep -v '\.read()\.unwrap()' | grep -v '\.write()\.unwrap()' | grep -v '\.lock()\.unwrap()' | grep -v 'with_ymd_and_hms.*\.unwrap()' || true)"
            if [ -n "$FILTERED" ]; then
              echo "FAIL: $f contains .unwrap()"
              echo "$FILTERED"
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then exit 1; fi
          echo "No unwrap: OK"

      - name: Readability ratchet
        run: bash scripts/readability-ratchet.sh check .ci/readability-baseline.env

      - name: Storage dispatch boundary ratchet
        run: bash scripts/check-storage-dispatch-boundary.sh

      - name: Dependency isolation
        run: |
          # Check temper-jit has no production dep on temper-verify
          if cargo tree --no-dev -p temper-jit 2>/dev/null | grep -q temper-verify; then
            echo "FAIL: temper-jit has production dependency on temper-verify"
            exit 1
          fi
          # Check no stateright/proptest in production crates
          for crate in temper-jit temper-server temper-runtime; do
            if cargo tree --no-dev -p "$crate" 2>/dev/null | grep -qE 'stateright|proptest'; then
              echo "FAIL: $crate production binary includes stateright or proptest"
              exit 1
            fi
          done
          echo "Dependency isolation: OK"

  # ─────────────────────────────────────────────────────
  # Gate 3: Full test suite (minutes)
  # ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install wasm target for GEPA test modules
        run: rustup target add wasm32-unknown-unknown

      - name: Build GEPA test WASM modules
        run: |
          for module in gepa-replay gepa-reflective gepa-score gepa-pareto gepa-verify; do
            (cd "wasm-modules/$module" && cargo build --target wasm32-unknown-unknown --release)
          done

      # temper-server's dst_* integration binaries run in the DST matrix below;
      # everything else runs here: other crates' dst_* binaries (the matrix only
      # covers temper-server) and lib unit tests that happen to have dst_ in
      # their name. (ARN-453: the old name filter `not test(dst_)` dropped those
      # lib tests, and nothing else ran them.)
      - name: cargo nextest run --workspace (temper-server dst_ binaries run in the matrix)
        run: cargo nextest run --workspace -E 'not (package(temper-server) and binary(/^dst_/))'

      # spec_validate_endpoint declares required-features = ["observe"]. The
      # workspace run above usually still covers it via feature unification
      # (temper-cli/temper-mcp enable temper-server's observe feature), but
      # that coverage is incidental — it evaporates if those edges change.
      # Run the observe-gated tests explicitly so coverage is guaranteed.
      # These stay on `cargo test` on purpose (ARN-439 decision D4): they are
      # narrow name-filtered runs whose whole job is to *guarantee* coverage, and
      # cargo test's positional-substring filter is the exact semantics relied on.
      - name: cargo test observe-gated tests
        run: |
          cargo test -p temper-server --features observe --test spec_validate_endpoint
          cargo test -p temper-server --features observe --lib observe::
          # api::repl tests (incl. server_repl_config_never_allows_host_ops,
          # the ARN-166 host-op isolation guard) compile only under `observe`;
          # run them explicitly so coverage never depends on feature unification.
          cargo test -p temper-server --features observe --lib api::repl::

      # nextest does NOT run (or compile) doctests, so the workspace nextest run
      # above drops doctest coverage — e.g. the no_run example in temper-sdk that
      # compile-checks the public client API. Run doctests explicitly to restore
      # exactly what nextest omits (compile-only for no_run; fast).
      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace

  # ─────────────────────────────────────────────────────
  # Gate 3b: DST/platform coverage (matrixed)
  #
  # ARN-439: platform-random full mode is the main-branch tail. Off-PR it is sharded
  # by SEED across 4 jobs (TEMPER_DST_SHARD_INDEX/COUNT) — not nextest --partition —
  # because each of its 5 test functions loops its seeds internally, so only
  # seed-level splitting balances the work. The union of the 4 shards is the full
  # seed set, so coverage is unchanged. On PRs platform-random runs as ONE smoke
  # cell (no shards): sharding a ~3-min smoke suite would just be 4x runner spin-up.
  # The matrix is built dynamically per event by dst-matrix-setup. All cells share
  # one rust-cache (shared-key: dst) since they compile the same test dep graph.
  # ─────────────────────────────────────────────────────
  dst-matrix-setup:
    name: DST matrix setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        # core/boot/consistency always run. platform-random: one smoke cell on PRs,
        # four full-mode seed shards on push/schedule/dispatch.
        # Cells are defined by EXCLUSION, not by listing binaries: every dst_* binary
        # lands in core unless a platform cell claims it, so a new dst_ test can
        # never be silently left out (ARN-453: three binaries were).
        run: |
          SUITES='[
            {"suite":"core","command":"cargo nextest run -p temper-server -E \"binary(/^dst_/) and not binary(/^dst_platform_/)\""},
            {"suite":"platform-boot","command":"cargo nextest run -p temper-server --test dst_platform_boot"},
            {"suite":"platform-consistency","command":"cargo nextest run -p temper-server -E \"binary(/^dst_platform_/) and not binary(/^dst_platform_boot$/) and not binary(/^dst_platform_random$/)\""}
          ]'
          RANDOM_CMD="cargo nextest run -p temper-server --test dst_platform_random"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANDOM_CELLS=$(jq -cn --arg cmd "$RANDOM_CMD" '[{suite:"platform-random",command:$cmd}]')
          else
            RANDOM_CELLS=$(jq -cn --arg cmd "$RANDOM_CMD" '[range(0;4) | {suite:"platform-random",shard_index:(.|tostring),shard_count:"4",command:$cmd}]')
          fi
          MATRIX=$(jq -cn --argjson s "$SUITES" --argjson r "$RANDOM_CELLS" '{include: ($s + $r)}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  dst-platform-tests:
    name: DST/Platform Tests (${{ matrix.suite }}${{ matrix.shard_count && format(' {0}/{1}', matrix.shard_index, matrix.shard_count) || '' }})
    needs: dst-matrix-setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dst-matrix-setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dst

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest DST/platform suite
        env:
          TEMPER_DST_RANDOM_MODE: ${{ matrix.suite == 'platform-random' && github.event_name == 'pull_request' && 'smoke' || 'full' }}
          TEMPER_DST_SHARD_INDEX: ${{ matrix.shard_index }}
          TEMPER_DST_SHARD_COUNT: ${{ matrix.shard_count }}
        run: ${{ matrix.command }}

  # ─────────────────────────────────────────────────────
  # Gate 4: Spec verification (minutes)
  # ─────────────────────────────────────────────────────
  verify-specs:
    name: Spec Verification (L0-L3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build temper-cli
        run: cargo build -p temper-cli

      - name: Verify all spec directories
        run: |
          # Find all directories containing .ioa.toml files
          SPEC_DIRS=$(find . -name '*.ioa.toml' -exec dirname {} \; | sort -u)
          if [ -z "$SPEC_DIRS" ]; then
            echo "No spec directories found — skipping verification"
            exit 0
          fi
          ALL_PASSED=true
          for dir in $SPEC_DIRS; do
            # Only verify dirs that also have a CSDL model
            if [ -f "$dir/model.csdl.xml" ]; then
              echo "Verifying specs in $dir..."
              if ! cargo run -p temper-cli -- verify --specs-dir "$dir"; then
                echo "FAIL: Spec verification failed for $dir"
                ALL_PASSED=false
              fi
            fi
          done
          if [ "$ALL_PASSED" = false ]; then exit 1; fi
          echo "All specs verified: OK"


  # ─────────────────────────────────────────────────────
  # Gate N: Instrumentation hygiene (ADR-0052)
  # Fails when a metric registration has no emission site.
  # ─────────────────────────────────────────────────────
  instrumentation-hygiene:
    name: Instrumentation Hygiene (ADR-0052)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run check_instrumentation
        run: cargo run -q -p temper-server --bin check_instrumentation
