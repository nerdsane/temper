name: CI

on:
  # Every pull request, whatever its base. A stacked pull request's base is another branch until that branch
  # merges, and GitHub's move of the base to main is an 'edited' event that starts nothing, so a push made
  # before the move got no CI at all (temper #330, 2 Nov 2026: fix-up 10bcdce3 at 05:47:00, base moved
  # 05:48:07, no run). Its checks run against the base it had; the push to main that lands it runs its tests.
  pull_request:
  push:
    branches: [main, staging]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      changed:
        description: "Paths to treat as changed (space-separated). Set: the pull-request lane for those paths. Empty: every check, as on main."
        required: false
        default: ""
      tests:
        description: "A nextest filterset, e.g. test(=module::name). Set: only the tests it selects run, in the one job Focused tests; every other job is skipped. Ignored tests it selects run too."
        required: false
        default: ""
      packages:
        description: "With tests: the packages to build and test (space-separated). Empty: the whole workspace."
        required: false
        default: ""
      save_cache:
        description: "Save the Rust build caches from this run (only main saves them otherwise)."
        type: boolean
        required: false
        default: false

# A new push to a pull request cancels its older run. Every push to main,
# schedule and dispatch runs to the end in its own group, so each commit on main gets a
# full verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-02-08
  # CI does not reuse incremental state between jobs. Local builds retain it.
  # Keep debug overrides aligned with Cargo.toml's dev/test defaults: workspace
  # backtraces retain file/line information. Dependency debug sections
  # are omitted by the package override in Cargo.toml.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Every cargo build here resolves features across the whole workspace, as main's
  # --workspace run does, whichever packages it selects with -p. The pr lane builds only
  # the packages a change reaches, and cargo's default resolves features for those alone,
  # so a dependency could build without a feature another package turns on: #147 gave
  # temper-server's dev-dependency opentelemetry-otlp the http-json feature, the shards
  # tested temper-observe without it and passed, and main's run failed for 11 hours
  # (#179). This is cargo's feature-unification (unstable, on the pinned nightly); a -p
  # build still compiles only its own dependency graph. Stable cargo, which affected.py's
  # cargo metadata uses, ignores it with a warning.
  CARGO_UNSTABLE_FEATURE_UNIFICATION: "true"
  CARGO_RESOLVER_FEATURE_UNIFICATION: workspace
  # The Actions cache holds 10 GB per repository. When every pull request saved its own
  # 0.3 to 1.4 GB per job, main's caches were evicted within minutes and pull requests,
  # which can only restore their own ref's caches or main's, compiled from scratch.
  # Only main (push, schedule, dispatch) saves; everything restores from main.
  SAVE_RUST_CACHE: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || inputs.save_cache == true }}
  # apt normally finishes in 6 to 18 seconds (66 steps on main, 27 Oct). That day a stalled
  # Ubuntu mirror held two runners in apt-get update for their jobs' whole 60 minutes and
  # took a pull request out of the merge queue. A request that stalls for 30 s is retried,
  # and an install step still running after 5 minutes is failed, so a stalled mirror costs
  # minutes and a re-run, not an hour of the queue.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  # ─────────────────────────────────────────────────────
  # What this run tests. Schedule and a plain dispatch: everything (lane "full"). A push or a pull
  # request: only the packages its changes can reach (lane "pr"), see scripts/ci/affected.py. A
  # push's changes are what it moved main by. Changes land by pushing to main (trunk-based
  # development; there is no merge queue), and every test runs once, on that push, so tests
  # never run twice for one change: a pull request only compiles and lints (Compile &
  # Lint, Integrity, Instrumentation Hygiene, the SDK's type check), so its author sees a broken
  # build in about four minutes, and every job that runs tests is skipped on it (output
  # tests=false). To run on a branch, before pushing it to main, exactly what that push will:
  #   gh workflow run ci.yml --ref <branch> -f changed="$(git diff --name-only origin/main...)"
  # Jobs with nothing to do are skipped here rather than started; a skipped job satisfies
  # a required check. The DST cells always start, because a matrix job skipped before it
  # expands reports none of the cell names the branch rules require.
  # ─────────────────────────────────────────────────────
  changes:
    name: Changed packages
    # A dispatch given tests runs only Focused tests. Every other job needs this one, so it
    # is skipped too; Tests, which runs after skipped jobs, checks the input itself.
    if: inputs.tests == ''
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.affected.outputs.lane }}
      mode: ${{ steps.affected.outputs.mode }}
      packages: ${{ steps.affected.outputs.packages }}
      test_args: ${{ steps.affected.outputs.test_args }}
      rust: ${{ steps.affected.outputs.rust }}
      sdk_ts: ${{ steps.affected.outputs.sdk_ts }}
      shards: ${{ steps.affected.outputs.shards }}
      tests: ${{ steps.affected.outputs.tests }}
      specs: ${{ steps.affected.outputs.specs }}
      dst_matrix: ${{ steps.dst.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGED_PATHS: ${{ inputs.changed }}
          # cargo metadata --no-deps needs no particular toolchain; skip installing the pinned one.
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/ci/affected.py

      # Every suite always has a cell (each is a required check). platform-random: one smoke
      # cell on the pr lane, four full-mode seed shards on the full lane.
      - id: dst
        env:
          LANE: ${{ steps.affected.outputs.lane }}
        run: |
          SUITES='[
            {"suite":"core","filter":"test(dst_) and not binary(/^dst_platform_/)"},
            {"suite":"platform-boot","filter":"test(dst_) and binary(=dst_platform_boot)"},
            {"suite":"platform-consistency","filter":"test(dst_) and binary(/^dst_platform_/) and not binary(=dst_platform_boot) and not binary(=dst_platform_random)"}
          ]'
          RANDOM_FILTER="test(dst_) and binary(=dst_platform_random)"
          if [ "$LANE" = "pr" ]; then
            RANDOM_CELLS=$(jq -cn --arg f "$RANDOM_FILTER" '[{suite:"platform-random",filter:$f}]')
          else
            RANDOM_CELLS=$(jq -cn --arg f "$RANDOM_FILTER" '[range(0;4) | {suite:"platform-random",shard_index:(.|tostring),shard_count:"4",filter:$f}]')
          fi
          MATRIX=$(jq -cn --argjson s "$SUITES" --argjson r "$RANDOM_CELLS" '{include: ($s + $r)}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # Gate 1: Fast checks (seconds)
  # ─────────────────────────────────────────────────────
  check:
    name: Compile & Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      # About 2 minutes of deletes; check and clippy fit without it on pull requests.
      - name: Free disk space for full workspace tests
        if: needs.changes.outputs.lane == 'full'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: cargo fmt --check
        run: cargo fmt --check

      # clippy --all-targets type-checks every target cargo check --workspace did, and the tests,
      # benches and examples too; a separate check cost 64 s before it (31 Oct 2026).
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # ─────────────────────────────────────────────────────
  # Gate 1a: TypeScript SDK (packages/temper-sdk-ts)
  # ─────────────────────────────────────────────────────
  sdk-ts:
    name: TypeScript SDK
    needs: changes
    if: needs.changes.outputs.sdk_ts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/temper-sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/temper-sdk-ts/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        if: needs.changes.outputs.tests == 'true'
        run: npx vitest run

  # ─────────────────────────────────────────────────────
  # Gate 1b: Bench compile (non-PR events only)
  # ─────────────────────────────────────────────────────
  bench-build:
    name: Bench Build
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.lane == 'full'
    timeout-minutes: 45
    env:
      # ARN-439: CI only compiles benches (--no-run), never runs them, so the release-inherited
      # lto=true + codegen-units=1 are pure compile-time waste here. Override them off for the
      # bench profile on this job only.
      CARGO_PROFILE_BENCH_LTO: "off"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: cargo bench --workspace --no-run
        run: cargo bench --locked --workspace --no-run

  # ─────────────────────────────────────────────────────
  # Gate 2: Integrity checks (seconds)
  # ─────────────────────────────────────────────────────
  integrity:
    name: Integrity & DST Patterns
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: No TODO/FIXME/HACK in production code
        run: |
          # Strip #[cfg(test)] blocks and proc macro crates before scanning
          FOUND=false
          for f in $(find crates -name '*.rs' -not -path '*/tests/*' -not -name '*_test.rs' -not -name '*_tests.rs' -not -name 'tests.rs' -not -path '*/temper-macros/*'); do
            # Extract only production code (stop at #[cfg(test)])
            PROD_CODE="$(awk '/^#\[cfg\(test\)\]/{exit} {print}' "$f")"
            if echo "$PROD_CODE" | grep -E '(TODO|FIXME|XXX|HACK)\b' | grep -v '// ci-ok' | grep -qv '^[[:space:]]*//' 2>/dev/null; then
              echo "FAIL: $f contains TODO/FIXME/HACK"
              echo "$PROD_CODE" | grep -nE '(TODO|FIXME|XXX|HACK)\b' | grep -v '// ci-ok' | grep -v '^[[:space:]]*//'
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then exit 1; fi
          echo "Integrity check: OK"

      - name: Pre-commit exclusion regression
        run: bash .claude/hooks/test-pre-commit.sh

      - name: No unwrap() in production code
        run: |
          # Strip #[cfg(test)] blocks and proc macro crates before scanning.
          # Exclude safe unwrap patterns:
          #   - .read().unwrap() / .write().unwrap() / .lock().unwrap() — RwLock/Mutex
          #     (poisoned lock = prior panic, TigerStyle fail-fast is correct)
          #   - .with_ymd_and_hms(...).unwrap() — chrono infallible for valid dates
          FOUND=false
          for f in $(find crates -name '*.rs' -not -path '*/tests/*' -not -name '*_test.rs' -not -name '*_tests.rs' -not -name 'tests.rs' -not -path '*/temper-macros/*' -not -path '*/benches/*'); do
            PROD_CODE="$(awk '/^#\[cfg\(test\)\]/{exit} {print}' "$f")"
            FILTERED="$(echo "$PROD_CODE" | grep '\.unwrap()' | grep -v '// ci-ok' | grep -v '^[[:space:]]*//' | grep -v '\.read()\.unwrap()' | grep -v '\.write()\.unwrap()' | grep -v '\.lock()\.unwrap()' | grep -v 'with_ymd_and_hms.*\.unwrap()' || true)"
            if [ -n "$FILTERED" ]; then
              echo "FAIL: $f contains .unwrap()"
              echo "$FILTERED"
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then exit 1; fi
          echo "No unwrap: OK"

      - name: Readability ratchet
        run: bash scripts/readability-ratchet.sh check .ci/readability-baseline.env

      - name: Storage dispatch boundary ratchet
        run: bash scripts/check-storage-dispatch-boundary.sh

      - name: Additive migrations
        run: bash scripts/check-additive-migrations.sh

      # The server embeds a build of wasm-modules/http-fetch; a change to that source or to
      # temper-wasm-sdk that was not rebuilt into the embedded binary fails here.
      - name: Embedded http_fetch module matches its source
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-http-fetch-wasm.sh --check

      # DST pattern scan DISABLED (2026-02-17)
      # Reason: Grep-based pattern matching is too brittle and caused 5+ consecutive
      # CI failures from false positives. The DST reviewer agent (.claude/agents/dst-reviewer.md)
      # performs semantic analysis which is strictly superior to regex scanning.
      # The pattern scan will be re-evaluated once the DST architecture refactor
      # (shared effect application) is complete.
      # See: .progress/012_20260217_dst_architecture_fix.md

      - name: Dependency isolation
        run: |
          # Check temper-jit has no production dep on temper-verify
          if cargo tree --locked --no-dev -p temper-jit 2>/dev/null | grep -q temper-verify; then
            echo "FAIL: temper-jit has production dependency on temper-verify"
            exit 1
          fi
          # Check no stateright/proptest in production crates
          for crate in temper-jit temper-server temper-runtime; do
            if cargo tree --locked --no-dev -p "$crate" 2>/dev/null | grep -qE 'stateright|proptest'; then
              echo "FAIL: $crate production binary includes stateright or proptest"
              exit 1
            fi
          done
          echo "Dependency isolation: OK"

  # ─────────────────────────────────────────────────────
  # Gate 3a: pull-request tests, split across machines
  # Only the packages a change can reach (scripts/ci/affected.py), by test-name hash.
  # temper-server runs with observe and sim on, the features the workspace run gives it,
  # so its observe-gated tests (spec_validate_endpoint, observe::, api::repl::) run here.
  # ─────────────────────────────────────────────────────
  test-shards:
    name: Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.lane == 'pr' && needs.changes.outputs.mode != 'none' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.shards) }}
    # Tests that need a database run or fail in CI (crates/temper-test-resource), so
    # every machine that runs them has one. Each test isolates itself by a unique tenant
    # or key, so a parallel run can share one database and one Redis.
    services:
      postgres:
        image: ${{ matrix.args != '' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: temper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: ${{ matrix.args != '' && 'redis:7' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      # temper-spec's migration_differential tests read older commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # Restores what main's full Tests job saved.
      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - name: Install cargo-nextest
        if: matrix.args != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Five separate workspaces; built side by side they take a quarter of the time.
      - name: Build GEPA test WASM modules
        if: matrix.gepa
        run: |
          rustup target add wasm32-unknown-unknown
          pids=()
          for module in gepa-replay gepa-reflective gepa-score gepa-pareto gepa-verify; do
            (
              cd "wasm-modules/$module"
              lock_args=()
              if [ -f Cargo.lock ]; then lock_args+=(--locked); fi
              cargo build "${lock_args[@]}" --quiet --target wasm32-unknown-unknown --release
            ) &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

      # Any package's tests may run against Turso's local sync server (the
      # store's turso_sync tests, serve's push tests), as in the full lane.
      - name: Install tursodb for the Turso Sync tests
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/tursodb.tar.xz \
            https://github.com/tursodatabase/turso/releases/download/v0.7.2/turso_cli-x86_64-unknown-linux-gnu.tar.xz
          echo "321e401e44f7ee8ea656caff0f85304025f7e905acafe7bedf6a9304f1af1783  /tmp/tursodb.tar.xz" | sha256sum -c -
          tar -xJf /tmp/tursodb.tar.xz -C /tmp
          echo "TEMPER_TEST_TURSODB=/tmp/turso_cli-x86_64-unknown-linux-gnu/tursodb" >> "$GITHUB_ENV"

      - run: echo "::add-matcher::.github/rust-test-failures.json"
        if: matrix.args != ''

      - name: cargo nextest run (affected packages, skip dst_)
        if: matrix.args != ''
        env:
          DATABASE_URL: postgres://postgres:temper@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
        run: cargo nextest run --locked ${{ matrix.args }} -E 'not test(dst_)' --partition ${{ matrix.partition }}

      - name: cargo test --doc (affected packages)
        if: matrix.doc != ''
        run: cargo test --locked --doc ${{ matrix.doc }}

  # ─────────────────────────────────────────────────────
  # Every Cargo workspace other than the root one: the os-app, GEPA and reference-app
  # modules and the test fixtures, each a workspace of its own that no -p from the root
  # reaches. scripts/ci/workspaces.py asks cargo which workspace each Cargo.toml on disk
  # belongs to and runs cargo test in every other one, --locked where it has a lock file,
  # so a new module is covered without a list here. Tests requires it. (Until 28 Oct 2026
  # nothing built them, and 21 of their lock files were stale from 24 Apr.)
  # ─────────────────────────────────────────────────────
  workspaces:
    name: Other workspaces
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.mode != 'none' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: cargo test, every other workspace
        run: python3 scripts/ci/workspaces.py

  # ─────────────────────────────────────────────────────
  # Gate 3: Full test suite (minutes)
  # The required "Tests" check. Full lane (schedule, plain dispatch): the
  # whole workspace on one machine, exactly as before. Pull-request lane (also a push): passes
  # when every test shard above passed, or nothing needed testing, or on a pull
  # request, which runs no tests (the push to main runs them). Either lane also
  # needs Other workspaces to have passed, or to have had nothing to test.
  # ─────────────────────────────────────────────────────
  test:
    name: Tests
    needs: [changes, test-shards, workspaces]
    if: ${{ !cancelled() && inputs.tests == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Tests that need a database run or fail in CI (crates/temper-test-resource), so
    # every machine that runs them has one. Each test isolates itself by a unique tenant
    # or key, so a parallel run can share one database and one Redis.
    services:
      postgres:
        image: ${{ needs.changes.outputs.lane == 'full' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: temper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: ${{ needs.changes.outputs.lane == 'full' && 'redis:7' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Pull-request lane result
        if: needs.changes.outputs.lane != 'full'
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test-shards.result }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "${{ needs.changes.outputs.tests }}" != true ]; then
            echo "A pull request only compiles and lints; the push to main runs the tests of: ${PACKAGES:-none}"
          else
            echo "Packages tested: ${PACKAGES:-none}"
          fi
          echo "changes: $CHANGES; test shards: $SHARDS"
          [ "$CHANGES" = success ] || exit 1
          case "$SHARDS" in success|skipped) ;; *) exit 1 ;; esac

      - uses: actions/checkout@v4
        if: needs.changes.outputs.lane == 'full'
        with:
          fetch-depth: 0

      - name: Install system dependencies
        if: needs.changes.outputs.lane == 'full'
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        if: needs.changes.outputs.lane == 'full'
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        if: needs.changes.outputs.lane == 'full'
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        if: needs.changes.outputs.lane == 'full'
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        if: needs.changes.outputs.lane == 'full'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Install cargo-nextest
        if: needs.changes.outputs.lane == 'full'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install wasm target for GEPA test modules
        if: needs.changes.outputs.lane == 'full'
        run: rustup target add wasm32-unknown-unknown

      - name: Build GEPA test WASM modules
        if: needs.changes.outputs.lane == 'full'
        run: |
          for module in gepa-replay gepa-reflective gepa-score gepa-pareto gepa-verify; do
            (
              cd "wasm-modules/$module"
              lock_args=()
              if [ -f Cargo.lock ]; then lock_args+=(--locked); fi
              cargo build "${lock_args[@]}" --target wasm32-unknown-unknown --release
            )
          done

      # temper-store-turso's turso_sync tests run against Turso's local sync
      # server, the tursodb release matching the pinned turso crate.
      - name: Install tursodb for the Turso Sync tests
        if: needs.changes.outputs.lane == 'full'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/tursodb.tar.xz \
            https://github.com/tursodatabase/turso/releases/download/v0.7.2/turso_cli-x86_64-unknown-linux-gnu.tar.xz
          echo "321e401e44f7ee8ea656caff0f85304025f7e905acafe7bedf6a9304f1af1783  /tmp/tursodb.tar.xz" | sha256sum -c -
          tar -xJf /tmp/tursodb.tar.xz -C /tmp
          echo "TEMPER_TEST_TURSODB=/tmp/turso_cli-x86_64-unknown-linux-gnu/tursodb" >> "$GITHUB_ENV"

      - run: echo "::add-matcher::.github/rust-test-failures.json"
        if: needs.changes.outputs.lane == 'full'

      - name: cargo nextest run --workspace (skip dst_)
        if: needs.changes.outputs.lane == 'full'
        env:
          DATABASE_URL: postgres://postgres:temper@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
        run: cargo nextest run --locked --workspace -E 'not test(dst_)'

      # spec_validate_endpoint declares required-features = ["observe"]. The
      # workspace run above usually still covers it via feature unification
      # (temper-cli/temper-mcp enable temper-server's observe feature), but
      # that coverage is incidental — it evaporates if those edges change.
      # Run the observe-gated tests explicitly so coverage is guaranteed.
      # These stay on `cargo test` on purpose (ARN-439 decision D4): they are
      # narrow name-filtered runs whose whole job is to *guarantee* coverage, and
      # cargo test's positional-substring filter is the exact semantics relied on.
      - name: cargo test observe-gated tests
        if: needs.changes.outputs.lane == 'full'
        run: |
          cargo test --locked -p temper-server --features observe --test spec_validate_endpoint
          cargo test --locked -p temper-server --features observe --lib observe::
          # api::repl tests (incl. server_repl_config_never_allows_host_ops,
          # the ARN-166 host-op isolation guard) compile only under `observe`;
          # run them explicitly so coverage never depends on feature unification.
          cargo test --locked -p temper-server --features observe --lib api::repl::

      # nextest does NOT run (or compile) doctests, so the workspace nextest run
      # above drops doctest coverage — e.g. the no_run example in temper-sdk that
      # compile-checks the public client API. Run doctests explicitly to restore
      # exactly what nextest omits (compile-only for no_run; fast).
      - name: cargo test --doc --workspace
        if: needs.changes.outputs.lane == 'full'
        run: cargo test --locked --doc --workspace

      - name: Other workspaces result
        env:
          WORKSPACES: ${{ needs.workspaces.result }}
        run: |
          echo "Other workspaces: $WORKSPACES"
          case "$WORKSPACES" in success|skipped) ;; *) exit 1 ;; esac

  # ─────────────────────────────────────────────────────
  # Tests that need a disposable PostgreSQL of their own: each is #[ignore]d with a
  # reason naming TEMPER_TEST_POSTGRES_URL or TEST_POLICY_DATABASE_URL, and this job
  # runs every such test in the packages this run tests (scripts/ci/postgres_ignored.py
  # finds them by that reason). Among them: a rollback boots, a release runs on a
  # Postgres schema a newer release migrated (crates/temper-store-postgres/migrations/README.md).
  # ─────────────────────────────────────────────────────
  postgres-migrations:
    name: Postgres rollback migrations
    needs: changes
    if: needs.changes.outputs.packages != '' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: temper
          # The policy-replacement test checks it runs on a database of this name.
          POSTGRES_DB: morrow_temper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the tests that need a disposable PostgreSQL
        id: select
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: python3 scripts/ci/postgres_ignored.py

      - name: Install system dependencies
        if: steps.select.outputs.args != ''
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        if: steps.select.outputs.args != ''
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        if: steps.select.outputs.args != ''
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key, so this job shares the
      # test jobs' cache only with the runner image's own stable Rust gone, as in theirs.
      - name: Keep only the pinned toolchain
        if: steps.select.outputs.args != ''
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        if: steps.select.outputs.args != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - name: Install cargo-nextest
        if: steps.select.outputs.args != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # One at a time: each test expects the database to itself while it runs.
      - name: Ignored tests that need a disposable PostgreSQL
        if: steps.select.outputs.args != ''
        env:
          TEMPER_TEST_POSTGRES_URL: postgres://postgres:temper@localhost:5432/postgres
          TEST_POLICY_DATABASE_URL: postgres://postgres:temper@localhost:5432/morrow_temper
          ARGS: ${{ steps.select.outputs.args }}
          FILTER: ${{ steps.select.outputs.filter }}
        run: cargo nextest run --locked $ARGS --run-ignored only --test-threads 1 --no-fail-fast -E "$FILTER"

  # ─────────────────────────────────────────────────────
  # Gate 3b: DST/platform coverage (matrixed)
  #
  # Every test whose name contains dst_ runs here, in the packages the Tests job
  # tests: Tests runs `not test(dst_)`, these cells run `test(dst_)`, so between
  # them every test of those packages runs. The cells split that one set by test
  # binary; a dst_ test outside the dst_platform_* binaries lands in core.
  #
  # ARN-439: platform-random full mode is the main-branch tail. Off-PR it is sharded
  # by SEED across 4 jobs (TEMPER_DST_SHARD_INDEX/COUNT) — not nextest --partition —
  # because each of its 5 test functions loops its seeds internally, so only
  # seed-level splitting balances the work. The union of the 4 shards is the full
  # seed set, so coverage is unchanged. On PRs platform-random runs as ONE smoke
  # cell (no shards): sharding a ~3-min smoke suite would just be 4x runner spin-up.
  # The matrix is built per run by the changes job.
  # ─────────────────────────────────────────────────────
  dst-platform-tests:
    name: DST/Platform Tests (${{ matrix.suite }}${{ matrix.shard_count && format(' {0}/{1}', matrix.shard_index, matrix.shard_count) || '' }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.dst_matrix) }}
    # The cells always run so each check reports; when no change reaches a package,
    # their steps are skipped. A pull request runs none: the push to main that lands
    # the change runs every suite it can reach.
    env:
      DST_NEEDED: ${{ needs.changes.outputs.test_args != '' && needs.changes.outputs.tests == 'true' }}
    steps:
      - name: Not affected
        if: env.DST_NEEDED != 'true'
        run: echo "No dst_ tests run here. Nothing new to test, or a pull request, whose push to main runs this suite."

      - uses: actions/checkout@v4
        if: env.DST_NEEDED == 'true'

      - name: Install system dependencies
        if: env.DST_NEEDED == 'true'
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        if: env.DST_NEEDED == 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        if: env.DST_NEEDED == 'true'
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        if: env.DST_NEEDED == 'true'
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      # The same packages and features as Tests, so main's full Tests cache fits.
      - name: Cache Rust build
        if: env.DST_NEEDED == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - name: Install cargo-nextest
        if: env.DST_NEEDED == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - run: echo "::add-matcher::.github/rust-test-failures.json"
        if: env.DST_NEEDED == 'true'

      # A package set can hold no test of a cell (a change only to temper-cli), so an
      # empty selection passes with a warning.
      - name: cargo nextest DST/platform suite
        if: env.DST_NEEDED == 'true'
        env:
          TEST_ARGS: ${{ needs.changes.outputs.test_args }}
          FILTER: ${{ matrix.filter }}
          TEMPER_DST_RANDOM_MODE: ${{ matrix.suite == 'platform-random' && needs.changes.outputs.lane == 'pr' && 'smoke' || 'full' }}
          TEMPER_DST_SHARD_INDEX: ${{ matrix.shard_index }}
          TEMPER_DST_SHARD_COUNT: ${{ matrix.shard_count }}
        run: cargo nextest run --locked $TEST_ARGS --no-tests=warn -E "$FILTER"

  # ─────────────────────────────────────────────────────
  # Gate 4: Spec verification (minutes)
  # ─────────────────────────────────────────────────────
  verify-specs:
    name: Spec Verification (L0-L3)
    needs: changes
    # These are temper-cli's verify:: tests, which read every spec collection in the
    # repository. The pr lane runs them here when a spec file
    # changed (scripts/ci/affected.py, SPEC_FILES). A run that tests temper-cli runs them
    # in Tests already, so this job only runs when it does not.
    if: >-
      needs.changes.outputs.specs == 'true' && needs.changes.outputs.tests == 'true'
      && !contains(format(' {0} ', needs.changes.outputs.packages), ' temper-cli ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # Source collections include partial fixtures and examples whose Rust
      # hosts/build scripts supply policies and modules. Keep checking every
      # collection's CSDL and IOA behavior; test the strict CLI on assembled
      # application fixtures, including missing-policy/module failure cases.
      - name: Verify repository sources and complete application fixtures
        run: |
          cargo test --locked -p temper-cli verify::



  # ─────────────────────────────────────────────────────
  # Gate N: Instrumentation hygiene (ADR-0052)
  # Fails when a metric registration has no emission site.
  # ─────────────────────────────────────────────────────
  instrumentation-hygiene:
    name: Instrumentation Hygiene (ADR-0052)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Run check_instrumentation
        run: cargo run --locked -q -p temper-server --bin check_instrumentation

  # ─────────────────────────────────────────────────────
  # Focused tests: a dispatch given tests runs only the tests its filterset selects, so a
  # fix can be shown failing on the old code and passing on the new without a whole run.
  #   gh workflow run ci.yml --ref <branch> \
  #     -f tests='test(=module::name)' -f packages=temper-server
  # The tests get what Tests and the Postgres job give theirs: PostgreSQL (both database
  # names), Redis, tursodb and the GEPA modules. Any test a lane runs can run here, dst_
  # and the #[ignore]d PostgreSQL tests included.
  # ─────────────────────────────────────────────────────
  focused:
    name: Focused tests
    if: inputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: temper
          # The policy-replacement test checks it runs on a database of this name.
          POSTGRES_DB: morrow_temper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      # temper-spec's migration_differential tests read older commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        timeout-minutes: 5  # a stalled mirror, see APT_OPTS
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libz3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      # rust-cache hashes every installed toolchain into its key. The runner image's own
      # stable Rust changes between image versions, which split one cache into several.
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | grep -v "^${{ env.RUST_TOOLCHAIN }}" | xargs -r -n1 rustup toolchain uninstall

      # Restores what main's full Tests job saved.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build GEPA test WASM modules
        run: |
          rustup target add wasm32-unknown-unknown
          pids=()
          for module in gepa-replay gepa-reflective gepa-score gepa-pareto gepa-verify; do
            (
              cd "wasm-modules/$module"
              lock_args=()
              if [ -f Cargo.lock ]; then lock_args+=(--locked); fi
              cargo build "${lock_args[@]}" --quiet --target wasm32-unknown-unknown --release
            ) &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

      - name: Install tursodb for the Turso Sync tests
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/tursodb.tar.xz \
            https://github.com/tursodatabase/turso/releases/download/v0.7.2/turso_cli-x86_64-unknown-linux-gnu.tar.xz
          echo "321e401e44f7ee8ea656caff0f85304025f7e905acafe7bedf6a9304f1af1783  /tmp/tursodb.tar.xz" | sha256sum -c -
          tar -xJf /tmp/tursodb.tar.xz -C /tmp
          echo "TEMPER_TEST_TURSODB=/tmp/turso_cli-x86_64-unknown-linux-gnu/tursodb" >> "$GITHUB_ENV"

      # The cargo arguments for the packages come from affected.py, so temper-server gets
      # the features the Tests shards give it. A filterset that selects no test fails.
      - name: cargo nextest run (the selected tests)
        env:
          TESTS: ${{ inputs.tests }}
          PACKAGES: ${{ inputs.packages }}
          DATABASE_URL: postgres://postgres:temper@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          TEMPER_TEST_POSTGRES_URL: postgres://postgres:temper@localhost:5432/postgres
          TEST_POLICY_DATABASE_URL: postgres://postgres:temper@localhost:5432/morrow_temper
        run: |
          set -f
          ARGS=$(python3 -c 'import sys; sys.path.insert(0, "scripts/ci"); import affected; print(affected.test_args(set(sys.argv[1:])) or "--workspace")' $PACKAGES)
          echo "cargo nextest run --locked $ARGS --run-ignored all --no-tests=fail -E '$TESTS'"
          cargo nextest run --locked $ARGS --run-ignored all --no-tests=fail -E "$TESTS"
