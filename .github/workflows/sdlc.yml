# The SDLC gates - one workflow, four jobs (ARN-453). Vendor as .github/workflows/sdlc.yml.
# The job names ARE the branch-protection contexts: planning, decision-log, proof, review.
#
# planning      - an effort must carry intent/spec/plan/decisions (docs/efforts/<key>/).
# decision-log  - the PR body carries a shaped "## Decisions & Tradeoffs" (or "No decisions").
# proof         - a valid proof record for this head (posted by the implementer, never
#                 committed); docs/workflow-only diffs are exempt; renders the report.
# review        - a valid review record for this head; applies RESOLVE adjudications;
#                 routes on panel risk. THE GATES VALIDATE; THEY NEVER SPAWN.
#
# A PR comment does not re-trigger pull_request workflows: post-*-record.sh scripts and
# the decision-intake workflow re-run this workflow (all four jobs; they are cheap).
# Adding any label fires `labeled` as a manual fallback.
name: sdlc
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  planning:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with: { fetch-depth: 0 }
      - name: Fetch the gate from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - fork PRs cannot run the gates (GitHub withholds secrets from forks); a maintainer re-pushes the branch in-repo to run them"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack"; exit 1; }
      - name: Require the design chain
        env:
          # attacker-controlled values reach the shell only via env, never inline
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s' "$PR_TITLE" "$PR_BODY" > /tmp/pr-text.txt
          python3 /tmp/stack/gates/check-effort-artifacts.py \
            --branch "$PR_BRANCH" --base "$PR_BASE" --head "$PR_HEAD" --pr-text-file /tmp/pr-text.txt

  decision-log:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the gate from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - fork PRs cannot run the gates (GitHub withholds secrets from forks); a maintainer re-pushes the branch in-repo to run them"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the gate"; exit 1; }
      - name: Write PR body to a file
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > /tmp/pr-body.md
      - name: Check the decision log
        run: python3 /tmp/stack/gates/check-decision-log.py /tmp/pr-body.md

  proof:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    # The `secrets` context is NOT allowed in step-level `if:`; hoist the presence
    # test into job-level env (which may read secrets) and gate the step on env.
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v6.0.2
        with: { fetch-depth: 0 }   # scope needs real history; a depth-1 diff fails
      - name: Fetch the proof toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - fork PRs cannot run the gates (GitHub withholds secrets from forks); a maintainer re-pushes the branch in-repo to run them"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the proof toolkit"; exit 1; }
          python3 -m pip install --quiet jsonschema || true
      - name: Does this change need proof?
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # proof is for behavior changes. A PR touching only docs/workflows/agent
          # config has nothing to drive - it passes without proof. A FAILED diff is
          # NOT "no code changed": it fails the gate loudly instead of skipping proof.
          if ! git diff --name-only "${PR_BASE}...${PR_HEAD}" > /tmp/changed.txt; then
            echo "::error::git diff ${PR_BASE}...${PR_HEAD} failed - cannot scope this PR, refusing to skip proof"
            exit 1
          fi
          # NOTE: no blanket .md exclusion - in these repos agent instructions and
          # skills (os-apps/**/SKILL.md, APP.md) are runtime behavior. Only genuinely
          # inert paths are excluded.
          CODE=$(grep -vE '^(\.github/workflows/|docs/|\.claude/|\.cursor/|README)' /tmp/changed.txt || true)
          if [ -z "$CODE" ]; then echo "needs=false" >> "$GITHUB_OUTPUT"; echo "No app code changed - proof not required."; else echo "needs=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the proof record from the PR (not committed)
        if: steps.scope.outputs.needs == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .proof
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          repo=os.environ.get("GITHUB_REPOSITORY","")
          body=subprocess.run(["gh","api",f"repos/{repo}/issues/{n}/comments",
                              "--paginate","-q",".[].body"],capture_output=True,text=True).stdout
          import base64
          rec=None
          def _consider(txt):
              global rec
              try:
                  cand=json.loads(base64.b64decode(txt).decode())
              except Exception:
                  return
              if cand.get("commit")==head: rec=cand
          for m in re.finditer(r"<!--\s*sdlc-proof-record-b64\s*([A-Za-z0-9+/=\s]+?)\s*-->", body):
              _consider(m.group(1).strip())
          if not rec:
              print(f"::error::no proof record for head {head} on the PR - run the verify skill against the current head and post it (bash stack/proof/post-proof-record.sh)")
              sys.exit(1)
          json.dump(rec, open(".proof/proof.json","w"))
          print("proof record for the current head loaded from the PR")
          PY
      - name: Validate proof (the gate)
        if: steps.scope.outputs.needs == 'true'
        run: |
          FDIR=$(ls -d .agents/skills/verify-*/features 2>/dev/null | head -1)
          # evidence must be URLs: CI has no local evidence files (never committed),
          # so a record citing local paths is unverifiable here
          python3 /tmp/stack/proof/validate.py .proof/proof.json --require-url-evidence ${FDIR:+--features-dir "$FDIR"}
      - name: Render report + summary
        if: steps.scope.outputs.needs == 'true'
        run: |
          python3 /tmp/stack/proof/render.py .proof/proof.json --out .proof/index.html --assets-dir .proof > .proof/summary.md
          cat .proof/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy report to access-controlled Vercel
        id: vercel
        # only when there is a report (scope needs proof) and Vercel is configured
        if: ${{ steps.scope.outputs.needs == 'true' && env.HAS_VERCEL == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest >/dev/null 2>&1
          URL=$(vercel deploy .proof --yes --token "$VERCEL_TOKEN" 2>/dev/null | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.needs == 'true'
        with:
          name: proof-report
          path: .proof/index.html
      - name: Post PR comment (updated in place)
        if: steps.scope.outputs.needs == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('.proof/summary.md','utf8');
            const url = '${{ steps.vercel.outputs.url }}';
            const link = url
              ? `\n\n**[Open the full report (team-only)](${url})**`
              : `\n\n_Full report: the \`proof-report\` artifact on this run (Vercel secrets not set)._`;
            const body = "<!-- sdlc-verification -->\n" + summary + link;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.body.includes('<!-- sdlc-verification -->'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

  review:
    # only review had a concurrency group before the merge into one file; proof
    # (Vercel deploy) and the cheap gates never did, and an `edited` event must not
    # cancel a proof render mid-flight.
    concurrency:
      group: sdlc-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write        # routing enables auto-merge
      pull-requests: write
      issues: write          # label create/apply is the Issues API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with: { fetch-depth: 0 }
      - name: Fetch the review toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - fork PRs cannot run the gates; a maintainer re-pushes the branch in-repo"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack"; exit 1; }
      - name: Find the record for this head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          body=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{n}/comments",
                              "--paginate","-q",".[].body"],capture_output=True,text=True).stdout
          import base64
          rec=None
          def _consider(txt):
              global rec
              try:
                  cand=json.loads(base64.b64decode(txt).decode())
              except Exception:
                  return
              if cand.get("commit")==head: rec=cand
          for m in re.finditer(r"<!--\s*sdlc-review-record-b64\s*([A-Za-z0-9+/=\s]+?)\s*-->", body):
              _consider(m.group(1).strip())
          if not rec:
              print(f"::error::no review record for head {head[:10]}. Owner: run the panel "
                    "(interrogate, or stack/review/run-cloud-panel.py on a computer copy) and post it "
                    "(stack/review/post-review-record.sh). This gate validates records; it does not produce them.")
              sys.exit(1)
          os.makedirs(".review",exist_ok=True)
          json.dump(rec, open(".review/review.json","w"))
          print("record found for the current head")
          PY
      - name: Merge Greptile findings into the record
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          r=json.load(open(".review/review.json")); n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          out=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/reviews",
                              "--paginate","-q",'.[] | select(.user.login|test("greptile";"i")) | .commit_id'],
                             capture_output=True,text=True).stdout
          if head in out:
              r.setdefault("reviewers_ran",[])
              if "greptile" not in r["reviewers_ran"]: r["reviewers_ran"].append("greptile")
          else:
              r.setdefault("reviewers_skipped",[]).append(
                  {"reviewer":"greptile","reason":"no Greptile review of this head yet"})
          json.dump(r,open(".review/review.json","w"),indent=2)
          PY
      - name: Apply owner adjudications (RESOLVE comments)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]
          raw=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{n}/comments",
                              "--paginate","-q",".[].body | @base64"],capture_output=True,text=True).stdout
          import base64 as _b64
          comments=[_b64.b64decode(l).decode() for l in raw.split() if l]
          resolutions={}
          # an adjudication comment BEGINS with RESOLVE: (same contract as intake) -
          # a quoted RESOLVE: mid-comment is discussion, not a ruling
          for c in comments:
              if not c.strip().startswith("RESOLVE:"): continue
              # rulings are the comment's leading RESOLVE: lines only - the first
              # other line ends them, so quoted syntax below cannot adjudicate
              for line in c.strip().splitlines():
                  m = re.match(r"RESOLVE:\s*(\S+)\s+(.+)$", line)
                  if not m: break
                  resolutions[m.group(1)]=m.group(2).strip()
          if resolutions:
              r=json.load(open(".review/review.json")); hit=0
              for f in r.get("findings",[]):
                  fl=f.get("file_line","")
                  if fl in resolutions and not f.get("resolved"):
                      f["resolved"]=True; f["resolution"]=f"owner adjudication: {resolutions[fl]}"; hit+=1
              json.dump(r,open(".review/review.json","w"),indent=2)
              print(f"adjudications applied: {hit}")
          PY
      - name: Validate the record (the gate)
        id: validate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 /tmp/stack/review/validate.py .review/review.json --require-commit "$PR_HEAD"
      - name: Route on the panel's risk judgment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          RISK=$(python3 -c "import json; print(json.load(open('.review/review.json')).get('risk','high'))")
          CHANGED=$(git diff --name-only "origin/${PR_BASE_REF}...HEAD") \
            || { echo "::error::cannot diff against base - failing closed"; exit 1; }
          disarm() {
            # deterministic revoke: skip when nothing is armed, and any failure
            # to revoke an ARMED auto-merge is fatal - no message matching
            local armed
            armed=$(gh pr view "$PR_NUM" --json autoMergeRequest -q '.autoMergeRequest != null')
            [ "$armed" = "true" ] || return 0
            gh pr merge "$PR_NUM" --disable-auto || { echo "::error::auto-merge is armed and could not be revoked"; exit 1; }
          }
          if grep -q '^\.github/workflows/' <<<"$CHANGED"; then
            disarm
            gh label create human-review --color D93F0B --description "SDLC: routed to a human decision" 2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            echo "workflow files changed - a human presses merge"; exit 0; fi
          if [ "$RISK" = "low" ]; then
            # arming auto-merge is a convenience, not the verdict: if the repo
            # forbids it, degrade to human-press instead of failing the gate
            if gh pr merge "$PR_NUM" --squash --auto; then
              echo "auto-merge enabled: panel risk low"
            else
              echo "::warning::could not arm auto-merge (repo setting?); risk is low - a human (or the owner-agent) presses merge"
            fi
          else
            # an earlier low-risk run may have armed auto-merge; revoke it
            disarm
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            echo "panel risk $RISK - a human presses merge"
          fi
      - name: Fold the verdict into a PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.review/review.json')) return;
            const r = JSON.parse(fs.readFileSync('.review/review.json','utf8'));
            const open = (r.findings||[]).filter(f => f.severity==='act-on' && !f.resolved).length;
            const validated = '${{ steps.validate.outcome }}' === 'success';
            const body = "<!-- sdlc-review -->\n" +
              `### Review — ${r.effort}: **${(validated && !open) ? 'PASS' : 'FAIL'}**\n` +
              `Panel: ${(r.reviewers_ran||[]).join(', ')}` +
              (r.reviewers_skipped?.length ? ` (skipped: ${r.reviewers_skipped.map(s=>s.reviewer).join(', ')})` : '') +
              `\nOpen act-on findings: **${open}** · risk: ${r.risk||'?'}\n`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.body.includes('<!-- sdlc-review -->'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
