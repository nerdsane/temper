# The decisions gate: no PR without a decision log (SDLC loop: the "decisions" stage). Vendor into a repo as
# .github/workflows/sdlc-decisions.yml. Reads the PR body, checks it carries a shaped
# '## Decisions & Tradeoffs' section (or an explicit 'No decisions'). Harness-
# agnostic, covers local and background/cloud agents, cannot be --no-verify'd.
name: sdlc-decisions
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  decision-log:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the gate from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - fork PRs cannot run the gates (GitHub withholds secrets from forks); a maintainer re-pushes the branch in-repo to run them"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the gate"; exit 1; }
      - name: Write PR body to a file
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > /tmp/pr-body.md
      - name: Check the decision log
        run: python3 /tmp/stack/gates/check-decision-log.py /tmp/pr-body.md
